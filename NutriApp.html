<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f8fafc" id="theme-color-meta">
<title>NutriApp 🥗</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>

<style>
/* ============ RESET & BASE ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-size: 15px;
  line-height: 1.45;
  transition: background-color .3s ease, color .3s ease;
}
body, .topbar, .bottomnav, .day-col, .day-card-big, .meal-card, .cat-block, .shop-item, .modal, .drawer, .plan-card, .preview-day, .dropzone, .fixed-panel, .fixed-block, .profile-summary, .alt-card, .day-pick, .ings-input, .field-block input, .field-block textarea, .field input, .toggle-train, .seg, .meal-actions button, .day-pill {
  transition: background-color .3s ease, color .3s ease, border-color .3s ease;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
input:focus, textarea:focus, button:focus { outline: none; }
::-webkit-scrollbar { width: 0; height: 0; }

:root {
  /* LIGHT (default) */
  --bg: #f8fafc;
  --bg-2: #f1f5f9;
  --card: #ffffff;
  --card-2: #f8fafc;
  --border: #e2e8f0;
  --border-2: #cbd5e1;
  --text: #0f172a;
  --muted: #64748b;
  --dim: #94a3b8;
  --bar-bg: #f1f5f9;
  --topbar-bg: #ffffff;
  --bottomnav-bg: #ffffff;
  --modal-backdrop: rgba(15,23,42,.35);
  --shadow: 0 1px 8px rgba(15,23,42,.08);
  --shadow-md: 0 6px 18px rgba(15,23,42,.10);
  --shadow-lg: 0 18px 48px rgba(15,23,42,.18);
  --shadow-card: 0 1px 8px rgba(15,23,42,.06);
  --kcal: #f59e0b;
  --prot: #ef4444;
  --carb: #f97316;
  --fat: #3b82f6;
  --ok: #10b981;
  --warn: #f97316;
  --danger: #ef4444;
  --fran: #3b82f6;
  --lua: #2dd4bf;
  --accent: var(--fran);
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 16px;
  --r-xl: 22px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
body.dark {
  --bg: #0f172a;
  --bg-2: #0b1322;
  --card: #1e293b;
  --card-2: #243349;
  --border: #334155;
  --border-2: #475569;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --dim: #64748b;
  --bar-bg: #0b1322;
  --topbar-bg: rgba(15,23,42,.92);
  --bottomnav-bg: rgba(15,23,42,.95);
  --modal-backdrop: rgba(2,6,15,.55);
  --shadow-card: 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.45);
  --kcal: #fbbf24;
  --prot: #f87171;
  --carb: #fb923c;
  --fat: #60a5fa;
}
body.profile-lua { --accent: var(--lua); }

/* ============ LOGIN ============ */
.login-screen {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding: 24px;
  background:
    radial-gradient(1100px 600px at 10% -10%, rgba(59,130,246,.25), transparent 60%),
    radial-gradient(900px 500px at 110% 110%, rgba(16,185,129,.22), transparent 55%),
    linear-gradient(135deg, #06101f 0%, #0f172a 50%, #112033 100%);
  background-size: 200% 200%;
  animation: bgshift 18s ease-in-out infinite;
  z-index: 9999;
}
@keyframes bgshift {
  0%,100% { background-position: 0% 0%, 100% 100%, 0% 0%; }
  50%     { background-position: 30% 20%, 70% 80%, 100% 100%; }
}
.login-card {
  width: min(420px, 100%);
  padding: 36px 28px 28px;
  border-radius: 24px;
  background: linear-gradient(180deg, rgba(30,41,59,.65), rgba(15,23,42,.55));
  border: 1px solid rgba(148,163,184,.18);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  box-shadow: var(--shadow-lg);
  animation: pop .5s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
.login-logo {
  text-align: center; margin-bottom: 22px;
}
.login-logo .mark {
  font-size: 56px; line-height: 1; display: inline-block;
  filter: drop-shadow(0 6px 14px rgba(16,185,129,.35));
}
.login-logo h1 {
  font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin-top: 10px;
  background: linear-gradient(135deg, #34d399, #60a5fa);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.login-logo p { color: var(--muted); margin-top: 4px; font-size: 14px; }
.field {
  position: relative; margin-bottom: 12px;
}
.field .ico {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 16px; opacity: .8; pointer-events: none;
}
.field input {
  width: 100%; padding: 14px 14px 14px 42px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 12px;
  color: #fff;
  transition: border-color .2s, background .2s;
}
.field input::placeholder { color: rgba(255,255,255,.55); }
.field input:focus { border-color: rgba(52,211,153,.7); background: rgba(255,255,255,.1); }
.btn-primary {
  width: 100%; padding: 14px 16px; margin-top: 8px;
  border-radius: 12px;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff; font-weight: 700; letter-spacing: .01em;
  box-shadow: 0 10px 22px rgba(16,185,129,.28);
  transition: transform .1s, box-shadow .2s, filter .2s;
}
.btn-primary:hover { filter: brightness(1.05); box-shadow: 0 14px 30px rgba(16,185,129,.35); }
.btn-primary:active { transform: translateY(1px); }
.login-error {
  background: rgba(239,68,68,.12); color: #fca5a5;
  border: 1px solid rgba(239,68,68,.35);
  padding: 10px 12px; border-radius: 10px; font-size: 13px;
  margin-bottom: 10px;
  animation: shake .35s;
}
@keyframes shake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(3px)} 30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)} }


/* ============ APP SHELL ============ */
.app { display: none; min-height: 100%; padding-top: calc(60px + var(--safe-top)); padding-bottom: calc(74px + var(--safe-bot)); }
.app.show { display: block; }
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: calc(60px + var(--safe-top));
  padding-top: var(--safe-top);
  background: var(--topbar-bg);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  padding-left: 14px; padding-right: 14px;
  z-index: 100;
}
.topbar .brand { font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
.topbar .brand small { color: var(--muted); font-weight: 500; font-size: 11px; display:block; margin-top:1px; }
.profile-tabs {
  margin-left: auto; margin-right: auto;
  display: flex; gap: 4px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px; padding: 3px;
}
.profile-tabs button {
  padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px;
  color: var(--muted); transition: color .2s, background .2s;
  display: flex; align-items: center; gap: 6px;
}
.profile-tabs button .dot { width: 8px; height: 8px; border-radius: 50%; }
.profile-tabs button[data-prof="fran"] .dot { background: var(--fran); }
.profile-tabs button[data-prof="lua"] .dot { background: var(--lua); }
.profile-tabs button.active[data-prof="fran"] { background: rgba(59,130,246,.15); color: var(--fran); }
.profile-tabs button.active[data-prof="lua"]  { background: rgba(45,212,191,.15); color: var(--lua); }
body.dark .profile-tabs button.active[data-prof="fran"] { color: #dbeafe; }
body.dark .profile-tabs button.active[data-prof="lua"]  { color: #ccfbf1; }
.btn-logout {
  padding: 7px 12px; border-radius: 10px; font-size: 13px;
  border: 1px solid var(--border); color: var(--muted);
  background: var(--card);
}
.btn-logout:hover { color: var(--text); border-color: var(--border-2); }
.btn-theme {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card);
  font-size: 16px; display: grid; place-items: center;
  flex: none;
}
.btn-theme:hover { border-color: var(--border-2); }

/* ============ BOTTOM NAV ============ */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(74px + var(--safe-bot));
  padding-bottom: var(--safe-bot);
  background: var(--bottomnav-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: stretch;
  z-index: 100;
}
.bottomnav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 6px 4px;
  color: var(--dim); font-size: 11px; font-weight: 600;
  position: relative; transition: color .2s;
}
.bottomnav button .glyph { font-size: 22px; line-height: 1; transition: transform .2s; }
.bottomnav button.active { color: var(--accent); }
.bottomnav button.active .glyph { transform: translateY(-2px) scale(1.05); }
.bottomnav button.active::before {
  content: ""; position: absolute; top: 6px; width: 36px; height: 4px; border-radius: 4px;
  background: var(--accent);
}

/* ============ SECTIONS ============ */
.section { display: none; padding: 14px 12px 24px; max-width: 1280px; margin: 0 auto; }
.section.active { display: block; animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ============ NUTRICIÓN HEADER ============ */
.profile-summary {
  background: linear-gradient(135deg, var(--card), var(--card-2));
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 16px;
  margin-bottom: 14px;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
}
.avatar {
  width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(135deg, color-mix(in oklab, var(--accent) 60%, #000), var(--accent));
  color: #fff; font-weight: 800; font-size: 22px;
  box-shadow: 0 8px 18px color-mix(in oklab, var(--accent) 35%, transparent);
}
.profile-summary .who h2 { font-size: 18px; font-weight: 800; }
.profile-summary .who p { font-size: 12px; color: var(--muted); }
.macro-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.chip {
  padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,.04); border: 1px solid var(--border);
}
.chip.kcal { color: var(--kcal); border-color: rgba(251,191,36,.3); background: rgba(251,191,36,.08); }
.chip.prot { color: var(--prot); border-color: rgba(248,113,113,.3); background: rgba(248,113,113,.08); }
.chip.carb { color: var(--carb); border-color: rgba(251,146,60,.3); background: rgba(251,146,60,.08); }
.chip.fat  { color: var(--fat);  border-color: rgba(96,165,250,.3); background: rgba(96,165,250,.08); }

/* ============ DAY PILLS + DAY VIEW ============ */
.day-pills {
  display: flex; gap: 8px; padding: 4px 2px 8px;
  overflow-x: auto; overflow-y: visible;
  margin: 0 -12px; padding-left: 12px; padding-right: 12px;
  flex-wrap: nowrap;
  scroll-snap-type: x proximity;
}
.day-pill {
  flex: 1 0 auto;
  min-width: 56px;
  padding: 10px 4px 8px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-weight: 700;
  color: var(--muted);
  position: relative;
  scroll-snap-align: center;
  box-shadow: var(--shadow-card);
}
.day-pill .ab { font-size: 16px; letter-spacing: -.02em; }
.day-pill .full { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
.day-pill.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
  box-shadow: 0 6px 16px color-mix(in oklab, var(--accent) 35%, transparent);
}
.day-pill.active .full { color: rgba(255,255,255,.78); }
.day-pill .train-mark {
  font-size: 11px; line-height: 1;
  margin-top: 3px;
}
.day-pill.active .train-mark { filter: brightness(1.2) saturate(1.3); }
.day-pill .train-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--warn);
  margin-top: 3px;
}
.day-pill.active .train-dot { background: #fff; }

.day-view { animation: dayfade .2s ease; }
@keyframes dayfade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.day-card-big {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.day-header-big {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 10px;
}
.day-card-big.training .day-header-big {
  background: linear-gradient(135deg, rgba(249,115,22,.18), rgba(239,68,68,.12));
  border-bottom-color: rgba(249,115,22,.35);
}
.day-card-big.training { border-color: rgba(249,115,22,.35); }
.day-header-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.day-name-big {
  font-weight: 800; font-size: 22px; letter-spacing: -.02em;
  cursor: pointer;
}
.day-name-big:hover { color: var(--accent); }
.day-totals { display: flex; flex-wrap: wrap; gap: 6px; }
.train-note-tip {
  margin-top: 8px;
  padding: 10px 12px;
  background: rgba(249,115,22,.08);
  border: 1px solid rgba(249,115,22,.25);
  border-radius: 12px;
  font-size: 12.5px;
  color: #b45309;
}
body.dark .train-note-tip { color: #fed7aa; background: rgba(249,115,22,.12); }
.training-badge {
  font-size: 10px; font-weight: 800; padding: 4px 9px; border-radius: 999px;
  background: linear-gradient(135deg, #f97316, #ef4444); color: #fff;
  letter-spacing: .04em;
}
.training-note { font-size: 11px; color: var(--warn); margin-top: -2px; }
.btn-train {
  width: 100%; padding: 14px 16px;
  border-radius: 14px;
  font-size: 14px; font-weight: 800;
  letter-spacing: .01em;
  background: var(--card);
  color: var(--muted);
  border: 1.5px solid var(--border);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .2s ease, color .2s ease, border-color .2s ease, transform .1s ease, box-shadow .2s ease;
}
.btn-train:hover { border-color: rgba(249,115,22,.5); color: var(--text); }
.btn-train:active { transform: scale(.98); }
.btn-train.on {
  background: #f97316;
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 18px -6px rgba(249,115,22,.6);
}
.btn-train.on:hover { background: #ea670c; color: #fff; }
.toggle-train {
  width: 38px; height: 22px; border-radius: 999px;
  background: rgba(148,163,184,.25);
  position: relative; transition: background .25s;
  flex: none;
}
.toggle-train::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; transition: transform .25s, background .2s;
  box-shadow: 0 2px 4px rgba(0,0,0,.3);
}
.toggle-train.on { background: linear-gradient(135deg, #f97316, #ef4444); }
.toggle-train.on::after { transform: translateX(16px); }
.day-macros { display: flex; flex-wrap: wrap; gap: 5px; }
.day-macros .pill {
  font-size: 11px; padding: 4px 9px; border-radius: 999px; font-weight: 700;
  background: var(--bg-2); border: 1px solid var(--border);
}
.day-macros .pill.kcal { color: var(--kcal); }
.day-macros .pill.prot { color: var(--prot); }
.day-macros .pill.carb { color: var(--carb); }
.day-macros .pill.fat  { color: var(--fat); }

.meal-card {
  padding: 18px;
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 10px;
}
.meal-card:last-child { border-bottom: 0; }
.meal-head { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.meal-name { font-size: 17px; font-weight: 700; line-height: 1.35; min-height: 18px; letter-spacing: -.01em; }
.meal-name.empty { color: var(--dim); font-style: italic; font-weight: 500; }
.meal-macros { display: flex; flex-wrap: wrap; gap: 6px; }
.meal-macros .chip { font-size: 12px; padding: 5px 10px; }
.meal-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.meal-actions button {
  flex: 1; min-width: 90px; padding: 10px 8px; border-radius: 10px; font-size: 13px; font-weight: 600;
  background: var(--bg-2); border: 1px solid var(--border);
  transition: background .15s, transform .1s, border-color .15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.meal-actions button:hover { background: var(--card-2); border-color: var(--border-2); }
.meal-actions button:active { transform: scale(.95); }
.snack-badge {
  font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 6px;
  background: rgba(168,85,247,.15); color: #d8b4fe; border: 1px solid rgba(168,85,247,.35);
  align-self: flex-start;
}

/* ============ FIXED PANEL ============ */
.fixed-panel {
  margin-top: 14px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); overflow: hidden;
}
.fixed-panel summary {
  padding: 14px 16px; cursor: pointer; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
  list-style: none;
}
.fixed-panel summary::-webkit-details-marker { display: none; }
.fixed-panel summary::after { content: "▾"; margin-left: auto; transition: transform .2s; color: var(--muted); }
.fixed-panel[open] summary::after { transform: rotate(180deg); }
.fixed-panel .body { padding: 4px 16px 16px; display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 720px) { .fixed-panel .body { grid-template-columns: 1fr 1fr; } }
.fixed-block {
  padding: 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md);
}
.fixed-block h4 { font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
.fixed-block p { font-size: 14px; line-height: 1.5; }
.fixed-block textarea {
  width: 100%; min-height: 70px; resize: vertical;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px; color: var(--text); font-size: 13px;
  margin-top: 6px;
}

/* ============ FAB ============ */
.fab {
  position: fixed; right: 16px; bottom: calc(86px + var(--safe-bot));
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 24px;
  box-shadow: 0 12px 30px color-mix(in oklab, var(--accent) 40%, transparent);
  z-index: 50;
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 12px 30px color-mix(in oklab, var(--accent) 40%, transparent), 0 0 0 0 color-mix(in oklab, var(--accent) 50%, transparent); }
  50% { box-shadow: 0 12px 30px color-mix(in oklab, var(--accent) 40%, transparent), 0 0 0 14px transparent; }
}

/* ============ MODALS ============ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: var(--modal-backdrop);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: none;
  z-index: 200;
  padding: 16px;
  align-items: center; justify-content: center;
}
.modal-backdrop.show { display: flex; animation: fade .25s; }
.modal {
  width: min(560px, 100%);
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 20px;
  animation: slidein .3s cubic-bezier(.2,.9,.3,1.05);
  box-shadow: var(--shadow-lg);
}
@keyframes slidein { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: none; } }
.modal h3 {
  font-size: 18px; font-weight: 800; margin-bottom: 4px; letter-spacing: -.01em;
}
.modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.modal .actions { display: flex; gap: 8px; margin-top: 16px; }
.modal .actions button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; }
.modal .btn-cancel { background: var(--bg-2); border: 1px solid var(--border); color: var(--text); }

.day-grid {

}
.day-pick {

}
.day-pick:hover { border-color: var(--accent); transform: translateY(-2px); }

.day-pick .dn { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }

.alt-card .use-btn {
  padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 13px;

}

.field-block { margin-bottom: 12px; }
.field-block label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.field-block input, .field-block textarea {

.ings-input {

}
.ing-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 8px; border-radius: 999px;

}

/* ============ DRAWER ============ */
.drawer-backdrop {
  position: fixed; inset: 0; background: var(--modal-backdrop);
  display: none; z-index: 250;
}
.drawer-backdrop.show { display: block; animation: fade .25s; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(440px, 100%);
  background: var(--card); border-left: 1px solid var(--border);
  z-index: 260;
  transform: translateX(100%);
  transition: transform .35s cubic-bezier(.2,.9,.3,1.05);

}
.drawer.show { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.drawer-head h3 { font-size: 20px; font-weight: 800; flex: 1; }
.drawer-close {
  width: 36px; height: 36px; border-radius: 50%;

}
.progress { margin-bottom: 12px; }
.progress .lab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.progress .lab b { color: var(--text); font-weight: 700; }
.progress .bar { height: 8px; background: var(--bg-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.progress .fill { height: 100%; border-radius: 999px; transition: width .8s cubic-bezier(.2,.9,.3,1); }
.progress .fill.kcal { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
.progress .fill.prot { background: linear-gradient(90deg, #f87171, #dc2626); }
.progress .fill.carb { background: linear-gradient(90deg, #fb923c, #ea580c); }

.banner-train {
  background: linear-gradient(135deg, rgba(249,115,22,.15), rgba(239,68,68,.10));
  border: 1px solid rgba(249,115,22,.35);

}

/* ============ SHOPPING ============ */

.shop-header {

.cat-head {

/* ============ TOAST + CONFETTI ============ */
.toast-stack { position: fixed; bottom: calc(96px + var(--safe-bot)); left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
.toast {

@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(20px); } }
.confetti {
  position: fixed; inset: 0; pointer-events: none; z-index: 1500; overflow: hidden;
}
.confetti span {
  position: absolute; width: 8px; height: 14px; top: -20px;

.section-title {

<script>
/* =============================================================
 * NUTRIAPP — single-file vanilla JS
 * ============================================================= */

const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DAY_SHORT = { Lunes:"Lun", Martes:"Mar", Miércoles:"Mié", Jueves:"Jue", Viernes:"Vie", Sábado:"Sáb", Domingo:"Dom" };

const GOALS = {
  fran: { kcal: 1900, prot: 140, carb: 200, fat: 65, name: "Fran" },
  lua:  { kcal: 1700, prot: 120, carb: 170, fat: 55, name: "Lúa" }
};

const CREDS = {
  fran: { pass: "admin2026", profile: "fran" },
  lua:  { pass: "lua2026",   profile: "lua"  }
};

/* ------------- STATE ------------- */
const AppState = {
  currentUser: null,
  activeProfile: "fran",
  plans: { fran: emptyPlan(), lua: emptyPlan() },
  entrenosDias: { fran: emptyEntrenos(), lua: emptyEntrenos() },
  shopChecked: {} // ingredient name -> true
};
function emptyPlan() {
  return {
    desayunoFijo: "",
    meriendasFijas: "",
    loadedAt: null,
    semana: DAYS.map(d => ({
      dia: d,
      comida: emptyMeal(),
      cena: emptyMeal(),
      meriendaEspecial: ""
    }))
  };
}
function emptyMeal() { return { nombre: "", ingredientes: [], calorias: 0, proteinas: 0, carbohidratos: 0, grasas: 0 }; }
function emptyEntrenos() { return Object.fromEntries(DAYS.map(d => [d, false])); }
function currentWeekKey() {
  // Devuelve la fecha (YYYY-MM-DD) del lunes de la semana actual
  const now = new Date();
  const dow = (now.getDay() + 6) % 7; // 0=Lun, 6=Dom
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
  const yyyy = mon.getFullYear();
  const mm = String(mon.getMonth() + 1).padStart(2, "0");
  const dd = String(mon.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

/* ------------- PERSISTENCE ------------- */
function loadAll() {
  try {
    const sess = JSON.parse(localStorage.getItem("nutri_session") || "null");
    if (sess?.user) AppState.currentUser = sess.user;
    const data = JSON.parse(localStorage.getItem("nutri_app_data") || "null");
    if (data?.plans) AppState.plans = mergePlans(data.plans);
    if (data?.activeProfile) AppState.activeProfile = data.activeProfile;
    const ent = JSON.parse(localStorage.getItem("nutri_entrenos") || "null");
    if (ent) AppState.entrenosDias = { fran: { ...emptyEntrenos(), ...(ent.fran||{}) }, lua: { ...emptyEntrenos(), ...(ent.lua||{}) } };
    // Auto-reset entrenos al inicio de cada semana (lunes)
    const wk = currentWeekKey();
    const savedWk = localStorage.getItem("nutri_entrenos_fecha");
    if (savedWk !== wk) {
      AppState.entrenosDias = { fran: emptyEntrenos(), lua: emptyEntrenos() };
      localStorage.setItem("nutri_entrenos_fecha", wk);
      localStorage.setItem("nutri_entrenos", JSON.stringify(AppState.entrenosDias));
    }
    const shop = JSON.parse(localStorage.getItem("nutri_shop_checked") || "null");
    if (shop) AppState.shopChecked = shop;
  } catch (e) { console.warn("load failed", e); }
}
function mergePlans(p) {
  const out = { fran: emptyPlan(), lua: emptyPlan() };
  for (const k of ["fran","lua"]) {
    if (p[k]) {
      out[k] = { ...emptyPlan(), ...p[k] };
      out[k].semana = DAYS.map((d, i) => ({
        dia: d,
        comida: { ...emptyMeal(), ...(p[k].semana?.[i]?.comida || {}) },
        cena: { ...emptyMeal(), ...(p[k].semana?.[i]?.cena || {}) },
        meriendaEspecial: p[k].semana?.[i]?.meriendaEspecial || ""
      }));
    }
  }
  return out;
}
function saveAll() {
  localStorage.setItem("nutri_app_data", JSON.stringify({ plans: AppState.plans, activeProfile: AppState.activeProfile }));
  localStorage.setItem("nutri_entrenos", JSON.stringify(AppState.entrenosDias));
  localStorage.setItem("nutri_entrenos_fecha", currentWeekKey());
  localStorage.setItem("nutri_shop_checked", JSON.stringify(AppState.shopChecked));
}
function saveSession(user) { localStorage.setItem("nutri_session", JSON.stringify({ user })); }
function clearSession() { localStorage.removeItem("nutri_session"); }

/* ------------- THEME ------------- */
function applyTheme(t) {
  document.body.classList.toggle("dark", t === "dark");
  const meta = document.getElementById("theme-color-meta");
  if (meta) meta.setAttribute("content", t === "dark" ? "#0f172a" : "#f8fafc");
  const btn = document.getElementById("theme-btn");
  if (btn) btn.textContent = t === "dark" ? "☀️" : "🌙";
}

function todayDay() {

function dayTotals(day) {
  const a = day.comida, b = day.cena;
  return {
    kcal: (a.calorias||0) + (b.calorias||0),
    prot: (a.proteinas||0) + (b.proteinas||0),
    carb: (a.carbohidratos||0) + (b.carbohidratos||0),
    fat:  (a.grasas||0) + (b.grasas||0)
  };
}
function weekTotals(plan) {
  return plan.semana.reduce((acc, d) => {
    const t = dayTotals(d);
    acc.kcal += t.kcal; acc.prot += t.prot; acc.carb += t.carb; acc.fat += t.fat;
    return acc;
  }, { kcal: 0, prot: 0, carb: 0, fat: 0 });
}

function onCalClick(e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const day = t.dataset.day;
  const slot = t.dataset.slot;
  if (act === "toggle-train") {
    AppState.entrenosDias[AppState.activeProfile][day] = !AppState.entrenosDias[AppState.activeProfile][day];
    saveAll(); render();
  } else if (act === "day-detail") {
    openDayDrawer(day);
  } else if (act === "swap") {
    openSwapModal(day, slot);
  } else if (act === "subst") {
    openSubstModal(day, slot);
  } else if (act === "edit") {
    openEditModal(day, slot);
  }
}

/* ----- SUBSTITUTE ----- */
const SUBST_RULES = [
  { match: /pollo/i, alts: ["Pavo a la plancha","Merluza al horno","Dorada al horno","Salmón a la plancha"] },
  { match: /patata/i, alts: ["Boniato asado","Arroz basmati","Pasta integral","Quinoa cocida"] },
  { match: /at[uú]n/i, alts: ["Sardinas","Caballa","Salmón","Huevo duro"] },
  { match: /ternera|res/i, alts: ["Cerdo magro","Pollo","Pavo","Cordero magro"] },
  { match: /pizza/i, alts: ["Wrap integral","Pasta con tomate","Arroz con verduras","Tortilla francesa con verduras"] },
  { match: /pavo/i, alts: ["Pollo a la plancha","Merluza al horno","Salmón","Tofu salteado"] },
  { match: /merluza|dorada|salm[oó]n|pescado/i, alts: ["Pollo a la plancha","Pavo","Atún","Huevos revueltos"] },
  { match: /arroz|pasta|quinoa|cuscús|cous/i, alts: ["Patata cocida","Boniato asado","Pan integral","Legumbres"] }
];
const FALLBACK_ALTS = ["Pollo con verduras","Salmón con quinoa","Tortilla francesa con ensalada","Pasta integral con tomate"];

function openSubstModal(day, slot) {
  const plan = AppState.plans[AppState.activeProfile];
  const meal = plan.semana.find(d => d.dia === day)[slot];
  const baseName = meal.nombre || "";
  const ings = meal.ingredientes.join(" ");
  let altNames = [];
  for (const r of SUBST_RULES) {
    if (r.match.test(baseName) || r.match.test(ings)) { altNames = r.alts; break; }
  }
  if (!altNames.length) altNames = FALLBACK_ALTS;

  // ±15% kcal/prot
  const baseKcal = meal.calorias || 500, baseProt = meal.proteinas || 35;
  const alts = altNames.map((n, i) => {
    const sign = i % 2 === 0 ? 1 : -1;
    const factor = 1 + (sign * (5 + i*3) / 100);
    return {
      nombre: n,
      ingredientes: guessIngredients(n),
      calorias: Math.round(baseKcal * factor),
      proteinas: Math.round(baseProt * factor),
      carbohidratos: Math.round((meal.carbohidratos||40) * factor),
      grasas: Math.round((meal.grasas||15) * factor)
    };
  });

  openModal(`
    <h3>🔁 Sustituir ${slot === "cena" ? "Cena" : "Comida"} del ${day}</h3>
    <p class="sub">Alternativas con ±15% en kcal y proteínas. Plato actual: <b>${escapeHtml(baseName) || "—"}</b></p>
    <div class="alt-list">
      ${alts.map((a, i) => `
        <div class="alt-card">
          <h4>${escapeHtml(a.nombre)}</h4>
          <div class="ings">${a.ingredientes.map(escapeHtml).join(" · ")}</div>
          <div class="row">
            <div class="meal-macros" style="flex:1">
              <span class="chip kcal">🔥 ${a.calorias}</span>
              <span class="chip prot">P ${a.proteinas}</span>
              <span class="chip carb">C ${a.carbohidratos}</span>
              <span class="chip fat">G ${a.grasas}</span>
            </div>
            <button class="use-btn" data-i="${i}">Usar esta</button>
          </div>
        </div>
      `).join("")}
    </div>
    <div class="actions">
      <button class="btn-cancel" data-x="cancel">Cancelar</button>
    </div>
  `);
  document.getElementById("modal-body").addEventListener("click", e => {
    if (e.target.dataset.x === "cancel") return closeModal();
    const b = e.target.closest(".use-btn");
    if (b) {
      const a = alts[parseInt(b.dataset.i,10)];
      const m = plan.semana.find(d => d.dia === day)[slot];
      Object.assign(m, a);
      saveAll(); closeModal(); render();
      toast(`✅ ${a.nombre} guardado`);
    }
  });
}
function guessIngredients(name) {
  const tokens = name.toLowerCase().split(/\s+|,|\sy\s|\scon\s/).filter(t => t.length > 2);
  const seen = new Set(); const out = [];
  for (const t of tokens) {
    const cap = t[0].toUpperCase() + t.slice(1);
    if (!seen.has(cap) && !["con","sin","plancha","horno","integral","cocida","cocido","asado","asada"].includes(t)) {
      seen.add(cap); out.push(cap);
    }
  }
  return out.length ? out : [name];
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("drawer-bd").classList.remove("show");
}
function progressBar(label, value, goal, unit, cls) {
  const pct = Math.min(100, Math.round((value / Math.max(1, goal)) * 100));
  return `
    <div class="progress">
      <div class="lab"><span>${label}</span><span><b>${Math.round(value)}</b> / ${goal} ${unit} · ${pct}%</span></div>
      <div class="bar"><div class="fill ${cls}" data-w="${pct}" style="width:0%"></div></div>
    </div>
  `;

const CAT_RULES = [
  { id: "Proteínas",    emo: "🥩", match: /pollo|pavo|ternera|cerdo|cordero|salm[oó]n|merluza|dorada|at[uú]n|sardin|caballa|huevo|tofu|seitan|garbanzo|lenteja|alub|jud[ií]a|queso|jam[oó]n|pavo|gambas|langostino|bacalao/i },
  { id: "Verduras y hortalizas", emo: "🥦", match: /tomate|lechuga|espina|brécol|brócoli|calabac|berenjena|pepino|pimient|zanahoria|cebolla|ajo|champi|seta|esp[aá]rrago|jud[ií]a verde|coliflor|kale|rúcula|aguacate|maíz|calabaza|patata|boniato|puerro|apio|rabanito|remolacha|verdura|ensalada/i },
  { id: "Carbohidratos", emo: "🍚", match: /arroz|pasta|fideo|cuscús|quinoa|pan|tortilla de trigo|wrap|tortita|avena|cereal|harina|cous|copos|lasaña|pizza/i },
  { id: "Lácteos",       emo: "🥛", match: /leche|yogur|kefir|queso|mantequilla|nata|requesón|cuajada|mozzarella|skyr|cottage/i },
  { id: "Otros",         emo: "🧴", match: /./ }
];
function categorize(name) {
  for (const c of CAT_RULES) if (c.match.test(name)) return c.id;
  return "Otros";
}
function buildShoppingList() {
  const map = new Map();
  for (const prof of ["fran","lua"]) {
    for (const d of AppState.plans[prof].semana) {
      for (const slot of ["comida","cena"]) {
        for (const ing of d[slot].ingredientes) {
          const p = parseIngString(ing);
          const cleanName = p.name.trim();
          if (!cleanName) continue;
          const key = cleanName.toLowerCase();
          if (!map.has(key)) {
            map.set(key, {
              name: cleanName.charAt(0).toUpperCase() + cleanName.slice(1).toLowerCase(),
              grams: 0, ml: 0, units: {}, count: 0,
              cat: categorize(cleanName)
            });
          }
          const acc = map.get(key);
          acc.count++;
          if (p.unit === "g")        acc.grams += p.qty;
          else if (p.unit === "ml") acc.ml    += p.qty;
          else if (p.unit)           acc.units[p.unit] = (acc.units[p.unit] || 0) + p.qty;
        }
      }
    }
  }
  const grouped = {};
  for (const c of CAT_RULES) grouped[c.id] = [];
  for (const item of map.values()) grouped[item.cat].push(item);
  for (const k of Object.keys(grouped)) grouped[k].sort((a, b) => a.name.localeCompare(b.name, "es"));
  return grouped;
}
function renderShop() {
  const root = document.getElementById("shop-content");
  const grouped = buildShoppingList();
  const all = Object.values(grouped).flat();
  if (!all.length) {
    root.innerHTML = `<div class="empty-state"><span class="emo">🛒</span><h3>No hay ingredientes aún</h3><p>Carga un plan en la sección "Mi Plan" para generar tu lista.</p></div>`;
    return;
  }
  const total = all.length;
  const pending = all.filter(i => !AppState.shopChecked[i.name.toLowerCase()]).length;
  let html = `
    <div class="shop-header">
      <div class="shop-counter">${pending} pendientes <small>de ${total}</small></div>
      <button class="btn-clear" id="clear-checks">Desmarcar todo</button>
    </div>
    <div class="shop-categories">
  `;
  for (const c of CAT_RULES) {
    const items = grouped[c.id];
    if (!items.length) continue;
    items.sort((a,b) => (AppState.shopChecked[a.name.toLowerCase()] ? 1 : 0) - (AppState.shopChecked[b.name.toLowerCase()] ? 1 : 0));
    html += `
      <div class="cat-block">
        <div class="cat-head"><span class="emo">${c.emo}</span><span>${c.id}</span><span class="ct">${items.length}</span></div>
        ${items.map(it => {
          const ck = !!AppState.shopChecked[it.name.toLowerCase()];
          const qtyStr = formatShopQty(it);
          return `<div class="shop-item${ck?' done':''}" data-key="${escapeHtml(it.name.toLowerCase())}">
            <div class="ck">✓</div>
            <div class="name">${escapeHtml(it.name)}</div>
            ${qtyStr ? `<div class="qty">${escapeHtml(qtyStr)}</div>` : ""}
          </div>`;
        }).join("")}
      </div>
    `;
  }
  html += `</div>
    <button class="shop-fab" id="copy-list">📋 Copiar lista para iPhone</button>
  `;
  root.innerHTML = html;
  root.querySelectorAll(".shop-item").forEach(el => el.onclick = () => {
    const k = el.dataset.key;
    AppState.shopChecked[k] = !AppState.shopChecked[k];
    saveAll(); renderShop();
  });
  document.getElementById("clear-checks").onclick = () => { AppState.shopChecked = {}; saveAll(); renderShop(); };
  document.getElementById("copy-list").onclick = shareList;
}
async function shareList() {
  const grouped = buildShoppingList();
  const today = new Date();
  const fmt = today.toLocaleDateString("es-ES", { day: "numeric", month: "long" });
  let text = `🛒 LISTA DE LA COMPRA — Semana del ${fmt}\n\n`;
  for (const c of CAT_RULES) {
    const items = grouped[c.id];
    if (!items.length) continue;
    text += `${c.emo} ${c.id.toUpperCase()}\n`;
    for (const it of items) {
      const q = formatShopQty(it);
      text += `-  ${it.name}${q ? " — " + q : ""}\n`;
    }
    text += "\n";
  }
  try {
    if (navigator.share) {
      await navigator.share({ title: "Lista de la compra", text });
      toast("✅ Lista compartida");
    } else {
      await navigator.clipboard.writeText(text);
      toast("📋 Lista copiada al portapapeles");
    }
  } catch (e) {
    try {
      await navigator.clipboard.writeText(text);
      toast("📋 Lista copiada al portapapeles");
    } catch { toast("❌ No se pudo copiar", true); }
  }
}

async function handleDocx(file) {
  const area = document.getElementById("parse-area");
  area.innerHTML = `<div class="processing"><div class="spinner"></div><span>Procesando ${escapeHtml(file.name)}…</span></div>`;
  try {
    const buf = await file.arrayBuffer();
    const result = await window.mammoth.extractRawText({ arrayBuffer: buf });
    const text = result.value;
    const parsed = parseDocxText(text);
    pendingParse = parsed;
    renderParsePreview(parsed, file.name);
  } catch (e) {
    console.error(e);
    area.innerHTML = `<div class="empty-state"><span class="emo">⚠️</span><h3>Error procesando archivo</h3><p>${escapeHtml(e.message || "Comprueba que sea un .docx válido")}</p></div>`;

function applyParsed(p, prof) {
  const plan = emptyPlan();

  plan.semana = DAYS.map(d => {

    if (found) return { dia: d, comida: found.comida, cena: found.cena, meriendaEspecial: found.meriendaEspecial || "" };
    return { dia: d, comida: emptyMeal(), cena: emptyMeal(), meriendaEspecial: "" };
  });
  AppState.plans[prof] = plan;
  // entrenos detectados
  const ent = emptyEntrenos();
  for (const dd of p.dias) if (dd.entreno) ent[dd.dia] = true;
  AppState.entrenosDias[prof] = ent;
  AppState.activeProfile = prof;
  saveAll();

const UNIT_RULES = [
  [/pollo/i, { unit: "g", def: 200 }],
  [/pavo/i, { unit: "g", def: 200 }],
  [/ternera|res/i, { unit: "g", def: 180 }],
  [/cerdo/i, { unit: "g", def: 180 }],
  [/cordero/i, { unit: "g", def: 180 }],
  [/salm[oó]n/i, { unit: "g", def: 180 }],
  [/merluza|bacalao|dorada|lubina/i, { unit: "g", def: 180 }],
  [/at[uú]n/i, { unit: "lata", def: 1 }],
  [/sardina|caballa/i, { unit: "g", def: 120 }],
  [/huevo/i, { unit: "ud", def: 2 }],
  [/jam[oó]n/i, { unit: "g", def: 60 }],
  [/queso/i, { unit: "g", def: 50 }],
  [/tofu/i, { unit: "g", def: 150 }],
  [/garbanzo|lenteja|alub|jud[ií]a(?! verde)/i, { unit: "g", def: 200 }],
  [/patata/i, { unit: "g", def: 250 }],
  [/boniato/i, { unit: "g", def: 200 }],
  [/arroz/i, { unit: "g", def: 60 }],
  [/pasta|fideo|macarr|espagueti|tallarin/i, { unit: "g", def: 70 }],
  [/quinoa/i, { unit: "g", def: 60 }],
  [/pan(?!\s*rallado)/i, { unit: "g", def: 60 }],
  [/tortilla de trigo|wrap|fajita/i, { unit: "ud", def: 2 }],
  [/tortita/i, { unit: "ud", def: 2 }],
  [/pizza/i, { unit: "ud", def: 1 }],
  [/yogur/i, { unit: "ud", def: 1 }],
  [/leche/i, { unit: "ml", def: 200 }],
  [/aceite/i, { unit: "ml", def: 10 }]
];
function unitForName(name) {
  for (const [r, info] of UNIT_RULES) if (r.test(name)) return info;
  return { unit: "g", def: 100 };
}
function findExplicitQty(text, matchWord) {
  const lower = text.toLowerCase();
  const idx = lower.indexOf(matchWord.toLowerCase());
  if (idx < 0) return null;
  const start = Math.max(0, idx - 50);
  const end = Math.min(text.length, idx + matchWord.length + 50);
  const win = text.slice(start, end);
  let m = win.match(/(\d+(?:[.,]\d+)?)\s*(kg|kgs|gramos|gr|g)\b/i);
  if (m) {
    const n = parseFloat(m[1].replace(",", "."));
    const u = m[2].toLowerCase();
    return { qty: u.startsWith("kg") ? Math.round(n * 1000) : Math.round(n), unit: "g" };
  }
  m = win.match(/(\d+)\s*(ml|cl|l)\b/i);
  if (m) {
    const n = parseInt(m[1], 10);
    const u = m[2].toLowerCase();
    return { qty: u === "l" ? n * 1000 : (u === "cl" ? n * 10 : n), unit: "ml" };
  }
  m = win.match(/(\d+)\s*(unidades?|uds?|fajitas?|tortitas?|wraps?|latas?|huevos?|piezas?|rebanadas?|lonchas?|yogures?|yogurts?)\b/i);
  if (m) {
    let u = m[2].toLowerCase().replace(/s$/, "");
    if (u === "huevo" || u === "pieza" || u === "unidade" || u === "unidad" || u === "ud") u = "ud";
    if (u === "yogure" || u === "yogurt") u = "ud";
    return { qty: parseInt(m[1], 10), unit: u };
  }
  return null;
}
function formatIng(name, qty, unit) {
  if (!qty || !unit) return name;
  if (unit === "g" || unit === "ml") return `${name} ${qty}${unit}`;
  return `${name} ${qty} ${unit}`;
}
function parseIngString(str) {
  if (!str) return { name: "", qty: null, unit: null };
  let m = str.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(kg|g|gramos|gr|ml|cl|l)\b/i);
  if (m) {
    const n = parseFloat(m[2].replace(",", "."));
    const u = m[3].toLowerCase();
    if (u.startsWith("k")) return { name: m[1].trim(), qty: Math.round(n * 1000), unit: "g" };
    if (u === "l")        return { name: m[1].trim(), qty: Math.round(n * 1000), unit: "ml" };
    if (u === "cl")       return { name: m[1].trim(), qty: Math.round(n * 10),   unit: "ml" };
    if (u === "ml")       return { name: m[1].trim(), qty: Math.round(n),         unit: "ml" };
    return { name: m[1].trim(), qty: Math.round(n), unit: "g" };
  }
  m = str.match(/^(.+?)\s+(\d+)\s*(ud|uds|unidades?|unidad|fajitas?|tortitas?|wraps?|latas?|piezas?|rebanadas?|lonchas?|raciones?)\b/i);
  if (m) {
    let u = m[3].toLowerCase().replace(/s$/, "");
    if (u === "unidade" || u === "unidad" || u === "ud" || u === "pieza" || u === "racione" || u === "racion") u = "ud";
    return { name: m[1].trim(), qty: parseInt(m[2], 10), unit: u };
  }
  return { name: str.trim(), qty: null, unit: null };
}
function formatGrams(n) {
  if (n >= 1000) {
    const v = n / 1000;
    return (v % 1 === 0 ? v.toFixed(0) : v.toFixed(2).replace(/\.?0+$/, "")).replace(".", ",") + " kg";
  }
  return n + " g";
}
function formatMl(n) {
  if (n >= 1000) return (n/1000).toFixed(n%1000===0?0:1).replace(".", ",") + " L";
  return n + " ml";
}
function formatShopQty(it) {
  const parts = [];
  if (it.grams) parts.push(formatGrams(it.grams));
  if (it.ml) parts.push(formatMl(it.ml));
  for (const [u, n] of Object.entries(it.units)) parts.push(`x${n} ${u}`);
  if (!parts.length && it.count > 1) parts.push(`x${it.count} raciones`);
  return parts.join(" · ");
}

function parseDocxText(text) {
  // Normalize
  const lines = text.split(/\r?\n/).map(l => l.replace(/\u00A0/g, " ").trim()).filter(Boolean);
  const upper = lines.map(l => l.toUpperCase());

  let desayuno = "", merienda = "";
  // find desayuno line
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^desayuno\s*[:\-–]\s*(.+)$/i);
    if (m) { desayuno = collectMulti(lines, i, m[1]); break; }
  }
  // find merienda / postre / media tarde
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^(media tarde|merienda|postre(?: medio?d[ií]a)?)\s*[:\-–]\s*(.+)$/i);
    if (m) { merienda = collectMulti(lines, i, m[2]); break; }
  }

  // find day blocks
  const dayRegex = /^\s*\**\s*(LUNES|MARTES|MIÉRCOLES|MIERCOLES|JUEVES|VIERNES|S[ÁA]BADO|DOMINGO)\b\s*\**(.*)$/i;
  const startsByDay = [];
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(dayRegex);
    if (m) startsByDay.push({ idx: i, name: normalizeDay(m[1]), tail: m[2] });
  }
  const dias = [];
  for (let k = 0; k < startsByDay.length; k++) {
    const cur = startsByDay[k];
    const end = startsByDay[k+1]?.idx ?? lines.length;
    const blockLines = lines.slice(cur.idx, end);
    const block = blockLines.join("\n");
    const trainHere = /\(\s*d[ií]a de entreno\s*\)|entreno/i.test(block);

    // Find Comida and Cena segments
    const comida = extractMealSegment(blockLines, /^comida\b/i, [/^cena\b/i]);
    const cena   = extractMealSegment(blockLines, /^cena\b/i, []);
    dias.push({
      dia: cur.name,
      entreno: trainHere,
      comida: estimateMacros(comida.text, comida.title),
      cena:   estimateMacros(cena.text,   cena.title),
      meriendaEspecial: ""
    });
  }
  return { desayuno, merienda, dias };
}
function collectMulti(lines, startIdx, firstChunk) {
  let out = firstChunk.trim();
  for (let j = startIdx + 1; j < lines.length; j++) {
    const ln = lines[j];
    if (/^(desayuno|media tarde|merienda|postre|comida|cena|lunes|martes|mi[eé]rcoles|jueves|viernes|s[áa]bado|domingo)\b/i.test(ln)) break;
    if (ln.length > 200) break;
    if (out.length > 250) break;
    out += " " + ln;
  }
  return out.trim();
}
function normalizeDay(d) {
  d = d.toUpperCase().replace("MIERCOLES","MIÉRCOLES").replace("SABADO","SÁBADO");
  return d.charAt(0) + d.slice(1).toLowerCase();
}
function extractMealSegment(blockLines, startRe, stopRes) {
  // search for line starting with startRe
  for (let i = 0; i < blockLines.length; i++) {
    const ln = blockLines[i];
    const m = ln.match(/^(comida|cena)\s*[:\-–]?\s*(.*)$/i);
    if (m && startRe.test(ln)) {
      const title = m[2]?.trim() || "";
      const out = [title];
      for (let j = i + 1; j < blockLines.length; j++) {
        const cur = blockLines[j];
        if (stopRes.some(r => r.test(cur))) break;
        if (/^(comida|cena)\b/i.test(cur)) break;
        if (/^(lunes|martes|mi[eé]rcoles|jueves|viernes|s[áa]bado|domingo)\b/i.test(cur)) break;
        out.push(cur);
      }
      const fullText = out.filter(Boolean).join(". ");
      return { text: fullText, title: shortName(fullText) };
    }
  }
  return { text: "", title: "" };
}
function shortName(text) {
  if (!text) return "";
  // take first sentence-ish chunk, max 60 chars
  let t = text.split(/[.\n;]/)[0].trim();
  if (t.length > 60) t = t.slice(0, 57) + "…";
  return t;
}
function estimateMacros(text, title) {
  const meal = emptyMeal();
  meal.nombre = title || shortName(text);
  if (!text) return meal;
  const found = new Set();
  const ings = [];
  for (const f of FOOD_DICT) {
    if (f.match.test(text) && !found.has(f.match.source)) {
      found.add(f.match.source);
      meal.calorias += f.kcal; meal.proteinas += f.prot; meal.carbohidratos += f.carb; meal.grasas += f.fat;
      const word = (text.match(f.match) || [""])[0];
      const cap = word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
      const explicit = findExplicitQty(text, word);
      const fallback = unitForName(cap);
      const qty = explicit ? explicit.qty : fallback.def;
      const unit = explicit ? explicit.unit : fallback.unit;
      ings.push(formatIng(cap, qty, unit));
    }
  }
  if (!ings.length) ings.push(...guessIngredients(meal.nombre));
  meal.ingredientes = [...new Set(ings)];
  if (meal.calorias < 300) meal.calorias = Math.max(meal.calorias, 400);
  return meal;
}

/* ============================================================= */
function toast(msg, err) {
  const stack = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}
function confetti() {
  const root = document.getElementById("confetti");
  root.classList.remove("hidden");
  root.innerHTML = "";
  const colors = ["#10b981","#fbbf24","#3b82f6","#f43f5e","#a855f7","#34d399"];
  for (let i = 0; i < 80; i++) {
    const s = document.createElement("span");
    s.style.left = Math.random() * 100 + "vw";
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random() * 0.3) + "s";
    s.style.animationDuration = (1.4 + Math.random() * 1) + "s";
    s.style.transform = `rotate(${Math.random()*360}deg)`;
    root.appendChild(s);
  }
  setTimeout(() => { root.classList.add("hidden"); root.innerHTML = ""; }, 2200);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

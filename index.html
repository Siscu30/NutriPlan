<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f8fafc" id="theme-color-meta">
<title>NutriApp 🥗</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ RESET & BASE ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-size: 15px;
  line-height: 1.45;
  transition: background .4s ease, color .3s ease;
  background-attachment: fixed !important;
}
body.profile-fran {
  background: radial-gradient(circle at 15% 50%, rgba(59,130,246,0.12), transparent 45%), radial-gradient(circle at 85% 30%, rgba(14,165,233,0.12), transparent 45%), var(--bg-color);
}
body.profile-lua {
  background: radial-gradient(circle at 15% 50%, rgba(45,212,191,0.15), transparent 45%), radial-gradient(circle at 85% 30%, rgba(244,114,182,0.12), transparent 45%), var(--bg-color);
}
body, .topbar, .bottomnav, .day-col, .day-card-big, .meal-card, .cat-block, .shop-item, .modal, .drawer, .plan-card, .preview-day, .dropzone, .fixed-panel, .fixed-block, .profile-summary, .alt-card, .day-pick, .ings-input, .field-block input, .field-block textarea, .field input, .toggle-train, .seg, .meal-actions button, .day-pill {
  transition: background .3s ease, color .3s ease, border-color .3s ease, box-shadow .3s ease;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
input:focus, textarea:focus, button:focus { outline: none; }
::-webkit-scrollbar { width: 0; height: 0; }

:root {
  /* LIGHT (default) */
  --bg-color: #f8fafc;
  --bg: var(--bg-color);
  --bg-2: #f1f5f9;
  --card: rgba(255, 255, 255, 0.75);
  --card-2: rgba(248, 250, 252, 0.65);
  --border: rgba(255, 255, 255, 0.5);
  --border-2: rgba(203, 213, 225, 0.8);
  --text: #0f172a;
  --muted: #64748b;
  --dim: #94a3b8;
  --bar-bg: rgba(241, 245, 249, 0.8);
  --topbar-bg: rgba(255, 255, 255, 0.75);
  --bottomnav-bg: rgba(255, 255, 255, 0.85);
  --modal-backdrop: rgba(15,23,42,.45);
  --shadow: 0 4px 16px rgba(15,23,42,.04);
  --shadow-md: 0 8px 24px rgba(15,23,42,.06);
  --shadow-lg: 0 24px 48px rgba(15,23,42,.12);
  --shadow-card: 0 4px 20px rgba(15,23,42,.05);
  --kcal: #f59e0b;
  --prot: #ef4444;
  --carb: #f97316;
  --fat: #3b82f6;
  --ok: #10b981;
  --warn: #f97316;
  --danger: #ef4444;
  --fran: #3b82f6;
  --lua: #2dd4bf;
  --accent: var(--fran);
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 16px;
  --r-xl: 22px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
body.dark {
  --bg-color: #0f172a;
  --bg: var(--bg-color);
  --bg-2: #0b1322;
  --card: rgba(30, 41, 59, 0.65);
  --card-2: rgba(36, 51, 73, 0.5);
  --border: rgba(255, 255, 255, 0.08);
  --border-2: rgba(71, 85, 105, 0.8);
  --text: #f8fafc;
  --muted: #94a3b8;
  --dim: #64748b;
  --bar-bg: rgba(11, 19, 34, 0.8);
  --topbar-bg: rgba(15, 23, 42, 0.75);
  --bottomnav-bg: rgba(15, 23, 42, 0.85);
  --modal-backdrop: rgba(2,6,15,.75);
  --shadow-card: 0 8px 32px rgba(0,0,0,.45);
  --shadow-lg: 0 24px 64px rgba(0,0,0,.65);
  --kcal: #fbbf24;
  --prot: #f87171;
  --carb: #fb923c;
  --fat: #60a5fa;
}
body.profile-lua { --accent: var(--lua); }

/* ============ LOGIN ============ */
.login-screen {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding: 24px;
  background:
    radial-gradient(1100px 600px at 10% -10%, rgba(59,130,246,.25), transparent 60%),
    radial-gradient(900px 500px at 110% 110%, rgba(16,185,129,.22), transparent 55%),
    linear-gradient(135deg, #06101f 0%, #0f172a 50%, #112033 100%);
  background-size: 200% 200%;
  animation: bgshift 18s ease-in-out infinite;
  z-index: 9999;
}
@keyframes bgshift {
  0%,100% { background-position: 0% 0%, 100% 100%, 0% 0%; }
  50%     { background-position: 30% 20%, 70% 80%, 100% 100%; }
}
.login-card {
  width: min(420px, 100%);
  padding: 36px 28px 28px;
  border-radius: 24px;
  background: linear-gradient(180deg, rgba(30,41,59,.65), rgba(15,23,42,.55));
  border: 1px solid rgba(148,163,184,.18);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  box-shadow: var(--shadow-lg);
  animation: pop .5s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
.login-logo {
  text-align: center; margin-bottom: 22px;
}
.login-logo .mark {
  font-size: 56px; line-height: 1; display: inline-block;
  filter: drop-shadow(0 6px 14px rgba(16,185,129,.35));
}
.login-logo h1 {
  font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin-top: 10px;
  background: linear-gradient(135deg, #34d399, #60a5fa);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.login-logo p { color: var(--muted); margin-top: 4px; font-size: 14px; }
.field {
  position: relative; margin-bottom: 12px;
}
.field .ico {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 16px; opacity: .8; pointer-events: none;
}
.field input {
  width: 100%; padding: 14px 14px 14px 42px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 12px;
  color: #fff;
  transition: border-color .2s, background .2s;
}
.field input::placeholder { color: rgba(255,255,255,.55); }
.field input:focus { border-color: rgba(52,211,153,.7); background: rgba(255,255,255,.1); }
.btn-primary {
  width: 100%; padding: 14px 16px; margin-top: 8px;
  border-radius: 12px;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff; font-weight: 700; letter-spacing: .01em;
  box-shadow: 0 10px 22px rgba(16,185,129,.28);
  transition: transform .1s, box-shadow .2s, filter .2s;
}
.btn-primary:hover { filter: brightness(1.05); box-shadow: 0 14px 30px rgba(16,185,129,.35); }
.btn-primary:active { transform: translateY(1px); }
.login-error {
  background: rgba(239,68,68,.12); color: #fca5a5;
  border: 1px solid rgba(239,68,68,.35);
  padding: 10px 12px; border-radius: 10px; font-size: 13px;
  margin-bottom: 10px;
  animation: shake .35s;
}
@keyframes shake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(3px)} 30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)} }


/* ============ APP SHELL ============ */
.app { display: none; min-height: 100%; padding-top: calc(60px + var(--safe-top)); padding-bottom: calc(74px + var(--safe-bot)); }
.app.show { display: block; }
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: calc(60px + var(--safe-top));
  padding-top: var(--safe-top);
  background: var(--topbar-bg);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  padding-left: 14px; padding-right: 14px;
  z-index: 100;
}
.topbar .brand { font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
.topbar .brand small { color: var(--muted); font-weight: 500; font-size: 11px; display:block; margin-top:1px; }
.profile-tabs {
  margin-left: auto; margin-right: auto;
  display: flex; gap: 4px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px; padding: 3px;
}
.profile-tabs button {
  padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px;
  color: var(--muted); transition: color .2s, background .2s;
  display: flex; align-items: center; gap: 6px;
}
.profile-tabs button .dot { width: 8px; height: 8px; border-radius: 50%; }
.profile-tabs button[data-prof="fran"] .dot { background: var(--fran); }
.profile-tabs button[data-prof="lua"] .dot { background: var(--lua); }
.profile-tabs button.active[data-prof="fran"] { background: rgba(59,130,246,.15); color: var(--fran); }
.profile-tabs button.active[data-prof="lua"]  { background: rgba(45,212,191,.15); color: var(--lua); }
body.dark .profile-tabs button.active[data-prof="fran"] { color: #dbeafe; }
body.dark .profile-tabs button.active[data-prof="lua"]  { color: #ccfbf1; }
.btn-logout {
  padding: 7px 12px; border-radius: 10px; font-size: 13px;
  border: 1px solid var(--border); color: var(--muted);
  background: var(--card);
}
.btn-logout:hover { color: var(--text); border-color: var(--border-2); }
.btn-theme {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card);
  font-size: 16px; display: grid; place-items: center;
  flex: none;
}
.btn-theme:hover { border-color: var(--border-2); }

/* ============ BOTTOM NAV ============ */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(74px + var(--safe-bot));
  padding-bottom: var(--safe-bot);
  background: var(--bottomnav-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: stretch;
  z-index: 100;
}
.bottomnav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 6px 4px;
  color: var(--dim); font-size: 11px; font-weight: 600;
  position: relative; transition: color .2s;
}
.bottomnav button .glyph { font-size: 22px; line-height: 1; transition: transform .2s; }
.bottomnav button.active { color: var(--accent); }
.bottomnav button.active .glyph { transform: translateY(-2px) scale(1.05); }
.bottomnav button.active::before {
  content: ""; position: absolute; top: 6px; width: 36px; height: 4px; border-radius: 4px;
  background: var(--accent);
}

/* ============ SECTIONS ============ */
.section { display: none; padding: 14px 12px 24px; max-width: 1280px; margin: 0 auto; }
.section.active { display: block; animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ============ NUTRICIÓN HEADER ============ */
.profile-summary {
  background: var(--card);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 18px;
  margin-bottom: 16px;
  display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  box-shadow: var(--shadow-card);
}
.avatar {
  width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(135deg, color-mix(in oklab, var(--accent) 60%, #000), var(--accent));
  color: #fff; font-weight: 800; font-size: 22px;
  box-shadow: 0 8px 18px color-mix(in oklab, var(--accent) 35%, transparent);
}
.profile-summary .who h2 { font-size: 18px; font-weight: 800; }
.profile-summary .who p { font-size: 12px; color: var(--muted); }
.macro-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.chip {
  padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,.04); border: 1px solid var(--border);
}
.chip.kcal { color: var(--kcal); border-color: rgba(251,191,36,.3); background: rgba(251,191,36,.08); }
.chip.prot { color: var(--prot); border-color: rgba(248,113,113,.3); background: rgba(248,113,113,.08); }
.chip.carb { color: var(--carb); border-color: rgba(251,146,60,.3); background: rgba(251,146,60,.08); }
.chip.fat  { color: var(--fat);  border-color: rgba(96,165,250,.3); background: rgba(96,165,250,.08); }

/* ============ DAY PILLS + DAY VIEW ============ */
.day-pills {
  display: flex; gap: 8px; padding: 4px 2px 8px;
  overflow-x: auto; overflow-y: visible;
  margin: 0 -12px; padding-left: 12px; padding-right: 12px;
  flex-wrap: nowrap;
  scroll-snap-type: x proximity;
}
.day-pill {
  flex: 1 0 auto;
  min-width: 56px;
  padding: 10px 4px 8px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-weight: 700;
  color: var(--muted);
  position: relative;
  scroll-snap-align: center;
  box-shadow: var(--shadow-card);
}
.day-pill .ab { font-size: 16px; letter-spacing: -.02em; }
.day-pill .full { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
.day-pill.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
  box-shadow: 0 6px 16px color-mix(in oklab, var(--accent) 35%, transparent);
}
.day-pill.active .full { color: rgba(255,255,255,.78); }
.day-pill .train-mark {
  font-size: 11px; line-height: 1;
  margin-top: 3px;
}
.day-pill.active .train-mark { filter: brightness(1.2) saturate(1.3); }
.day-pill .train-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--warn);
  margin-top: 3px;
}
.day-pill.active .train-dot { background: #fff; }

.day-view { animation: dayfade .2s ease; display: flex; flex-direction: column; gap: 10px; }
@keyframes dayfade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
/* day-card-big: now transparent wrapper — styles moved to MEAL CARDS section above */
.day-header-big {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 10px;
}
.day-card-big.training .day-header-big {
  background: linear-gradient(135deg, rgba(249,115,22,.18), rgba(239,68,68,.12));
  border-bottom-color: rgba(249,115,22,.35);
}
.day-card-big.training { border-color: rgba(249,115,22,.35); }
.day-header-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.day-name-big {
  font-weight: 800; font-size: 22px; letter-spacing: -.02em;
  cursor: pointer;
}
.day-name-big:hover { color: var(--accent); }
.day-totals { display: flex; flex-wrap: wrap; gap: 6px; }
.train-note-tip {
  margin-top: 8px;
  padding: 10px 12px;
  background: rgba(249,115,22,.08);
  border: 1px solid rgba(249,115,22,.25);
  border-radius: 12px;
  font-size: 12.5px;
  color: #b45309;
}
body.dark .train-note-tip { color: #fed7aa; background: rgba(249,115,22,.12); }
.training-badge {
  font-size: 10px; font-weight: 800; padding: 4px 9px; border-radius: 999px;
  background: linear-gradient(135deg, #f97316, #ef4444); color: #fff;
  letter-spacing: .04em;
}
.training-note { font-size: 11px; color: var(--warn); margin-top: -2px; }
.btn-train {
  width: 100%; padding: 14px 16px;
  border-radius: 14px;
  font-size: 14px; font-weight: 800;
  letter-spacing: .01em;
  background: var(--card);
  color: var(--muted);
  border: 1.5px solid var(--border);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .2s ease, color .2s ease, border-color .2s ease, transform .1s ease, box-shadow .2s ease;
}
.btn-train:hover { border-color: rgba(249,115,22,.5); color: var(--text); }
.btn-train:active { transform: scale(.98); }
.btn-train.on {
  background: #f97316;
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 18px -6px rgba(249,115,22,.6);
}
.btn-train.on:hover { background: #ea670c; color: #fff; }
.toggle-train {
  width: 38px; height: 22px; border-radius: 999px;
  background: rgba(148,163,184,.25);
  position: relative; transition: background .25s;
  flex: none;
}
.toggle-train::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; transition: transform .25s, background .2s;
  box-shadow: 0 2px 4px rgba(0,0,0,.3);
}
.toggle-train.on { background: linear-gradient(135deg, #f97316, #ef4444); }
.toggle-train.on::after { transform: translateX(16px); }
.day-macros { display: flex; flex-wrap: wrap; gap: 5px; }
.day-macros .pill {
  font-size: 11px; padding: 4px 9px; border-radius: 999px; font-weight: 700;
  background: var(--bg-2); border: 1px solid var(--border);
}
.day-macros .pill.kcal { color: var(--kcal); }
.day-macros .pill.prot { color: var(--prot); }
.day-macros .pill.carb { color: var(--carb); }
.day-macros .pill.fat  { color: var(--fat); }

/* ============ MEAL CARDS — STANDALONE CARDS ============ */

/* El contenedor ya no agrupa las dos cards — eliminamos su overflow/fondo */
.day-card-big {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  display: flex; flex-direction: column; gap: 10px;
  padding: 0;
}
/* El header del día sí mantiene card propia */
.day-header-big {
  background: var(--card);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
}
.day-card-big.training .day-header-big {
  background: linear-gradient(135deg, rgba(249,115,22,.14), rgba(239,68,68,.08)), var(--card);
  border-color: rgba(249,115,22,.3);
}
.day-card-big.training { border-color: transparent; }

/* Cada meal-card es ahora una card independiente */
.meal-card {
  background: var(--card);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  padding: 18px;
  display: flex; flex-direction: column; gap: 12px;
  position: relative;
  overflow: hidden;
  transition: box-shadow .2s, transform .15s;
}
.meal-card:last-child { border-bottom: none; }

/* Franja de color en el borde izquierdo — Comida */
.meal-card[data-meal="comida"] {
  border-left: 3px solid rgba(249,115,22,0.6);
}
.meal-card[data-meal="comida"]::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, rgba(249,115,22,0.5), rgba(251,191,36,0.3), transparent);
}
/* Franja de color en el borde izquierdo — Cena */
.meal-card[data-meal="cena"] {
  border-left: 3px solid rgba(99,102,241,0.55);
}
.meal-card[data-meal="cena"]::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, rgba(99,102,241,0.45), rgba(167,139,250,0.25), transparent);
}

.meal-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 10.5px; color: var(--muted); font-weight: 800;
  letter-spacing: .08em; text-transform: uppercase;
}
.meal-head-icon {
  width: 26px; height: 26px; border-radius: 8px;
  display: grid; place-items: center; font-size: 14px;
  flex-shrink: 0;
}
.meal-card[data-meal="comida"] .meal-head-icon {
  background: rgba(249,115,22,0.12);
}
.meal-card[data-meal="cena"] .meal-head-icon {
  background: rgba(99,102,241,0.12);
}

.meal-name {
  font-size: 16px; font-weight: 700; line-height: 1.4;
  min-height: 18px; letter-spacing: -.01em; color: var(--text);
}
.meal-name.empty { color: var(--dim); font-style: italic; font-weight: 500; }

/* Chips de macros */
.meal-macros { display: flex; flex-wrap: wrap; gap: 6px; }
.meal-macros .chip { font-size: 11.5px; padding: 5px 10px; border-radius: 999px; font-weight: 700; }

/* Selector de variante (proteína / carbohidrato) */
.variant-selector {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.variant-selector label {
  font-size: 11px; font-weight: 800; color: var(--muted);
  letter-spacing: .05em; text-transform: uppercase;
}
.variant-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.variant-chip {
  padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  border: 1.5px solid var(--border-2); background: var(--card); color: var(--text);
  cursor: pointer; transition: all .15s;
}
.variant-chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
.variant-chip:hover:not(.selected) { border-color: var(--accent); color: var(--accent); }

/* Botones de acción: 2 columnas, Editar full-width */
.meal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 2px;
}
.meal-actions button {
  padding: 10px 8px; border-radius: 11px; font-size: 12.5px; font-weight: 600;
  background: var(--bg-2);
  border: 1px solid var(--border);
  transition: background .15s, transform .12s, border-color .15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  color: var(--text);
}
.meal-actions button:hover { background: var(--card-2); border-color: var(--border-2); }
.meal-actions button:active { transform: scale(.95); }
.meal-actions button[data-act="edit"] {
  grid-column: 1 / -1;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  padding: 7px;
  border-style: dashed;
}
.meal-actions button[data-act="edit"]:hover { background: var(--bg-2); color: var(--text); border-style: solid; }

.snack-badge {
  font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 6px;
  background: rgba(168,85,247,.15); color: #d8b4fe; border: 1px solid rgba(168,85,247,.35);
  align-self: flex-start;
}

/* Nota del diario real */
.meal-diary-note {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
}
.meal-diary-note .diary-kcal-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(245,158,11,0.12); color: var(--kcal);
  border: 1px solid rgba(245,158,11,0.25);
  padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 700;
  margin-top: 6px;
}
.tracker-card {
  background: var(--card); border: 1px solid var(--border);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-radius: var(--r-lg); padding: 14px;
  box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 8px;
}
.tracker-head { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 14px; }
.tracker-head span { font-size: 12px; font-weight: 600; color: var(--muted); }

/* ============ DIARIO REAL — FORMULARIO ESTRUCTURADO ============ */
.diary-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }

.diary-row {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: 12px;
  padding: 10px 10px 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.diary-row-inputs {
  display: flex; align-items: center; gap: 8px;
}
.diary-qty-wrap {
  display: flex; align-items: center; gap: 4px;
  background: var(--card); border: 1.5px solid var(--border-2);
  border-radius: 9px; padding: 6px 8px;
  flex: 0 0 72px;
}
.diary-qty {
  width: 40px; background: none; border: none;
  font-size: 15px; font-weight: 700; color: var(--text);
  text-align: right; padding: 0;
}
.diary-qty::-webkit-outer-spin-button,
.diary-qty::-webkit-inner-spin-button { -webkit-appearance: none; }
.diary-qty-unit { font-size: 12px; color: var(--muted); font-weight: 700; }

.diary-food-wrap { flex: 1; position: relative; }
.diary-food-input {
  width: 100%; padding: 8px 10px;
  background: var(--card); border: 1.5px solid var(--border-2);
  border-radius: 9px; font-size: 14px; color: var(--text);
}
.diary-food-input:focus { border-color: var(--accent); }

.diary-suggestions {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 999;
  background: var(--card);
  border: 1px solid var(--border-2);
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  max-height: 220px; overflow-y: auto;
}
.diary-sug-item {
  padding: 9px 12px; cursor: pointer;
  display: flex; flex-direction: column; gap: 1px;
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.diary-sug-item:last-child { border-bottom: none; }
.diary-sug-item:hover { background: var(--bg-2); }
.sug-name { font-size: 13px; font-weight: 700; color: var(--text); }
.sug-macro { font-size: 11px; color: var(--muted); }
.sug-macro small { opacity: .7; }

.diary-rm {
  width: 28px; height: 28px; border-radius: 8px; flex: none;
  background: rgba(239,68,68,.1); color: #ef4444; font-size: 12px;
  display: grid; place-items: center;
  transition: background .15s;
}
.diary-rm:hover { background: rgba(239,68,68,.2); }

.diary-row-macro {
  font-size: 11.5px; color: var(--accent); font-weight: 600;
  padding: 0 2px;
}

.diary-add-row {
  width: 100%; padding: 9px;
  border: 1.5px dashed var(--border-2); border-radius: 10px;
  color: var(--muted); font-size: 13px; font-weight: 600;
  text-align: center;
  transition: border-color .15s, color .15s, background .15s;
  margin-bottom: 12px;
}
.diary-add-row:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent) 6%, transparent); }

.diary-summary {
  background: rgba(245,158,11,.07);
  border: 1px solid rgba(245,158,11,.2);
  border-radius: 12px; padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.diary-summary-title { font-size: 13px; font-weight: 800; color: var(--kcal); }
.diary-summary-macros { display: flex; flex-wrap: wrap; gap: 6px; }

.diary-hint {
  font-size: 12.5px; color: var(--muted);
  padding: 10px 12px; background: var(--bg-2);
  border-radius: 10px; text-align: center;
  margin-bottom: 4px;
}
.trackers-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  margin-bottom: 0; margin-top: 0;
}
.tracker-widget {
  background: var(--card); border: 1px solid var(--border);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-radius: var(--r-lg); padding: 14px;
  box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 8px;
}
.tracker-widget .tw-head { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; color: var(--text); }
.tracker-widget .tw-head .tw-icon { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; }
.tracker-widget.water .tw-icon { background: rgba(59,130,246,.15); color: #3b82f6; }
.tracker-widget.steps .tw-icon { background: rgba(16,185,129,.15); color: #10b981; }

.water-glasses { display: flex; flex-wrap: wrap; gap: 4px; }
.water-glass {
  flex: 1; min-width: 18px; max-width: 24px; height: 28px; border-radius: 6px;
  background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.2);
  position: relative; overflow: hidden; cursor: pointer; transition: transform .1s;
}
.water-glass:active { transform: scale(.9); }
.water-glass.filled { background: rgba(59,130,246,.2); border-color: #3b82f6; }
.water-glass.filled::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0; top: 20%;
  background: linear-gradient(180deg, #60a5fa, #3b82f6); border-radius: 0 0 5px 5px;
}

.steps-ctrl { display: flex; align-items: center; gap: 8px; }
.steps-input {
  flex: 1; width: 100%; min-width: 0; padding: 6px 10px; border-radius: 8px;
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text); font-weight: 700; font-size: 16px;
}
.steps-btn {
  width: 30px; height: 30px; border-radius: 8px; background: rgba(16,185,129,.15); color: #10b981;
  font-weight: 800; font-size: 16px; display: grid; place-items: center; flex: none;
}
.steps-btn:active { transform: scale(.9); background: #10b981; color: #fff; }
.steps-bar { height: 6px; border-radius: 999px; background: rgba(16,185,129,.15); overflow: hidden; margin-top: 4px; }
.steps-bar .fill { height: 100%; background: #10b981; transition: width .3s ease; }

/* ============ FIXED PANEL ============ */
.fixed-panel {
  margin-top: 14px;
  background: var(--card); border: 1px solid var(--border);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-card);
}
.fixed-panel summary {
  padding: 14px 16px; cursor: pointer; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
  list-style: none;
}
.fixed-panel summary::-webkit-details-marker { display: none; }
.fixed-panel summary::after { content: "▾"; margin-left: auto; transition: transform .2s; color: var(--muted); }
.fixed-panel[open] summary::after { transform: rotate(180deg); }
.fixed-panel .body { padding: 4px 16px 16px; display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 720px) { .fixed-panel .body { grid-template-columns: 1fr 1fr; } }
.fixed-block {
  padding: 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md);
}
.fixed-block h4 { font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
.fixed-block p { font-size: 14px; line-height: 1.5; }
.fixed-block textarea {
  width: 100%; min-height: 70px; resize: vertical;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px; color: var(--text); font-size: 13px;
  margin-top: 6px;
}

/* ============ FAB ============ */
.fab {
  position: fixed; right: 16px; bottom: calc(86px + var(--safe-bot));
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 24px;
  box-shadow: 0 12px 30px color-mix(in oklab, var(--accent) 40%, transparent);
  z-index: 50;
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 12px 30px color-mix(in oklab, var(--accent) 40%, transparent), 0 0 0 0 color-mix(in oklab, var(--accent) 50%, transparent); }
  50% { box-shadow: 0 12px 30px color-mix(in oklab, var(--accent) 40%, transparent), 0 0 0 14px transparent; }
}

/* ============ MODALS ============ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: var(--modal-backdrop);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: none;
  z-index: 200;
  padding: 16px;
  align-items: center; justify-content: center;
}
.modal-backdrop.show { display: flex; animation: fade .25s; }
.modal {
  width: min(560px, 100%);
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 20px;
  animation: slidein .3s cubic-bezier(.2,.9,.3,1.05);
  box-shadow: var(--shadow-lg);
}
@keyframes slidein { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: none; } }
.modal h3 {
  font-size: 18px; font-weight: 800; margin-bottom: 4px; letter-spacing: -.01em;
}
.modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.modal .actions { display: flex; gap: 8px; margin-top: 16px; }
.modal .actions button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; }
.modal .btn-cancel { background: var(--bg-2); border: 1px solid var(--border); color: var(--text); }
.modal .btn-confirm { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.modal .btn-confirm:hover { filter: brightness(1.07); }

.seg {
  display: flex; gap: 4px; padding: 4px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 14px;
}
.seg button {
  flex: 1; padding: 8px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted);
}
.seg button.active { background: var(--accent); color: #fff; }

.day-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px;
  margin-bottom: 6px;
}
.day-pick {
  padding: 10px; border-radius: 12px;
  background: var(--bg-2); border: 1px solid var(--border);
  text-align: left; transition: all .15s;
}
.day-pick:hover { border-color: var(--accent); transform: translateY(-2px); }
.day-pick.selected { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, var(--bg-2)); }
.day-pick .dn { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.day-pick .pn { font-size: 13px; font-weight: 600; line-height: 1.3; margin-top: 4px; min-height: 32px; }

.alt-list { display: grid; gap: 10px; }
.alt-card {
  padding: 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md);
  display: flex; flex-direction: column; gap: 8px;
}
.alt-card h4 { font-size: 14px; font-weight: 700; }
.alt-card .ings { font-size: 12px; color: var(--muted); }
.alt-card .row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.alt-card .use-btn {
  padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 13px;
  background: var(--accent); color: #fff;
}

.field-block { margin-bottom: 12px; }
.field-block label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.field-block input, .field-block textarea {
  width: 100%; padding: 10px 12px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 14px;
}
.field-block input:focus, .field-block textarea:focus { border-color: var(--accent); }
.macro-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ings-input {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 8px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  min-height: 44px; align-items: center;
}
.ing-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 8px; border-radius: 999px;
  background: color-mix(in oklab, var(--accent) 15%, var(--bg));
  border: 1px solid color-mix(in oklab, var(--accent) 30%, var(--border));
  font-size: 12px; font-weight: 600;
}
.ing-tag button { color: var(--muted); padding: 0 2px; font-size: 14px; line-height: 1; }
.ings-input input { flex: 1; min-width: 100px; background: transparent; border: 0; padding: 4px; font-size: 13px; }

/* ============ DRAWER ============ */
.drawer-backdrop {
  position: fixed; inset: 0; background: var(--modal-backdrop);
  display: none; z-index: 250;
}
.drawer-backdrop.show { display: block; animation: fade .25s; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(440px, 100%);
  background: var(--card); border-left: 1px solid var(--border);
  z-index: 260;
  transform: translateX(100%);
  transition: transform .35s cubic-bezier(.2,.9,.3,1.05);
  overflow-y: auto;
  padding: 20px 18px calc(20px + var(--safe-bot));
}
.drawer.show { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.drawer-head h3 { font-size: 20px; font-weight: 800; flex: 1; }
.drawer-close {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg-2); border: 1px solid var(--border); font-size: 18px;
}
.progress { margin-bottom: 12px; }
.progress .lab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.progress .lab b { color: var(--text); font-weight: 700; }
.progress .bar { height: 8px; background: var(--bg-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.progress .fill { height: 100%; border-radius: 999px; transition: width .8s cubic-bezier(.2,.9,.3,1); }
.progress .fill.kcal { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
.progress .fill.prot { background: linear-gradient(90deg, #f87171, #dc2626); }
.progress .fill.carb { background: linear-gradient(90deg, #fb923c, #ea580c); }
.progress .fill.fat  { background: linear-gradient(90deg, #60a5fa, #2563eb); }

.banner-train {
  background: linear-gradient(135deg, rgba(249,115,22,.15), rgba(239,68,68,.10));
  border: 1px solid rgba(249,115,22,.35);
  color: #b45309; font-size: 13px; font-weight: 600;
  padding: 10px 12px; border-radius: 12px; margin: 8px 0 14px;
}
body.dark .banner-train { color: #fed7aa; background: linear-gradient(135deg, rgba(249,115,22,.2), rgba(239,68,68,.15)); }
.compare-table {
  width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px;
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
}
.compare-table th, .compare-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
.compare-table th { background: var(--bg-2); font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
.compare-table tr:last-child td { border-bottom: 0; }

/* ============ SHOPPING ============ */
.shopping-section { background: linear-gradient(180deg, rgba(255,255,255,.02), transparent); }
.shop-header {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 14px 16px; display: flex; align-items: center; gap: 10px;
  position: sticky; top: calc(60px + var(--safe-top) + 8px);
  z-index: 5; backdrop-filter: blur(8px);
  box-shadow: var(--shadow-card);
}
.shop-counter { font-weight: 700; font-size: 14px; flex: 1; }
.shop-counter small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.btn-clear {
  padding: 7px 12px; border-radius: 9px; font-size: 12px; font-weight: 700;
  background: var(--bg-2); border: 1px solid var(--border); color: var(--muted);
}
.shop-categories { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; padding-bottom: 90px; }
.cat-block {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); overflow: hidden;
}
.cat-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; font-size: 16px; font-weight: 800;
  border-bottom: 1px solid var(--border);
  background: var(--card-2);
}
.cat-head .emo { font-size: 22px; }
.cat-head .ct {
  margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 700;
  background: var(--bg-2); border: 1px solid var(--border);
  padding: 3px 9px; border-radius: 999px;
}
.shop-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none;
  transition: background .15s, opacity .25s;
}
.shop-item:last-child { border-bottom: 0; }
.shop-item:hover { background: var(--bg-2); }
.shop-item .ck {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--border-2);
  display: grid; place-items: center; font-size: 13px; color: transparent;
  flex: none; transition: all .2s;
}
.shop-item.done .ck {
  background: var(--ok); border-color: var(--ok); color: #fff;
}
.shop-item .name { flex: 1; transition: all .25s; }
.shop-item .qty { font-size: 12px; color: var(--muted); font-weight: 600; }
.shop-item.done .name { text-decoration: line-through; opacity: .55; }
.shop-fab {
  position: fixed; bottom: calc(82px + var(--safe-bot)); left: 16px; right: 16px;
  padding: 14px 20px;
  border-radius: 16px;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff; font-weight: 800; font-size: 15px;
  box-shadow: 0 14px 30px rgba(16,185,129,.35);
  z-index: 40;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.shop-fab:active { transform: translateY(1px); }

.empty-state {
  padding: 40px 20px; text-align: center; color: var(--muted);
  background: var(--card); border: 1px dashed var(--border); border-radius: var(--r-lg);
}
.empty-state .emo { font-size: 42px; display: block; margin-bottom: 10px; }
.empty-state h3 { color: var(--text); font-size: 16px; margin-bottom: 4px; }

/* ============ IMPORT ============ */
.import-section { background: var(--bg); }
.dropzone {
  border: 2px dashed var(--border-2);
  border-radius: 22px;
  padding: 40px 20px;
  text-align: center;
  background: var(--card);
  transition: all .25s;
  position: relative; overflow: hidden;
  margin-bottom: 14px;
  box-shadow: var(--shadow-card);
}
.dropzone.drag { border-color: var(--ok); background: rgba(16,185,129,.08); transform: scale(1.01); }
.dropzone .ico { font-size: 48px; margin-bottom: 10px; display: block; animation: bob 3s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.dropzone h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.dropzone p { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.dropzone .pick {
  padding: 10px 18px; border-radius: 12px;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 13px;
  display: inline-block;
}
.dropzone::before {
  content: ""; position: absolute; inset: 4px; border-radius: 18px;
  background: linear-gradient(90deg, transparent 30%, rgba(16,185,129,.18) 50%, transparent 70%);
  background-size: 200% 100%; animation: shimmer 4s linear infinite;
  opacity: .25; pointer-events: none;
}
@keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

.profile-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
.profile-pick .pp {
  padding: 14px; border-radius: var(--r-md);
  background: var(--card); border: 2px solid var(--border);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  transition: all .2s;
}
.profile-pick .pp .av { font-size: 32px; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; }
.profile-pick .pp[data-p="fran"] .av { background: linear-gradient(135deg, #1d4ed8, #3b82f6); }
.profile-pick .pp[data-p="lua"]  .av { background: linear-gradient(135deg, #0d9488, #2dd4bf); }
.profile-pick .pp .nm { font-weight: 700; font-size: 14px; }
.profile-pick .pp[data-p="fran"].active { border-color: var(--fran); background: rgba(59,130,246,.12); }
.profile-pick .pp[data-p="lua"].active  { border-color: var(--lua); background: rgba(45,212,191,.12); }

.spinner {
  display: inline-block; width: 22px; height: 22px;
  border: 3px solid rgba(255,255,255,.25); border-top-color: #fff;
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.processing {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  padding: 16px; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-md); margin-top: 12px;
}

.preview-list { display: grid; gap: 10px; margin-top: 14px; }
.preview-day {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 12px;
  animation: pop .35s ease-out both;
}
.preview-day h4 { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.preview-day .meal { margin-top: 6px; font-size: 13px; }
.preview-day .meal b { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.preview-day .train-mark { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: rgba(249,115,22,.2); color: #fed7aa; border: 1px solid rgba(249,115,22,.4); }

.plan-status {
  display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 24px;
}
@media (min-width: 720px) { .plan-status { grid-template-columns: 1fr 1fr; } }
.plan-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 14px;
}
.plan-card.fran { border-top: 3px solid var(--fran); }
.plan-card.lua { border-top: 3px solid var(--lua); }
.plan-card h4 { font-size: 15px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.plan-card .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.plan-card .reset-btn {

  background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.3);
}

/* ============ NEW MOBILE UI ============ */
.date-nav {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-full);
  margin-bottom: 24px; padding: 6px;
}
.date-btn {
  width: 36px; height: 36px; border-radius: 50%; background: var(--bg-2);
  display: grid; place-items: center; font-size: 14px; color: var(--text); border: 1px solid var(--border);
}
.date-display {
  flex: 1; text-align: center; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#global-date {
  position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%;
}
.date-text { font-weight: 800; font-size: 15px; }

.rings-widget { display: flex; gap: 16px; margin-top: 14px; }
.ring-wrap { position: relative; width: 44px; height: 44px; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--bg-2); stroke-width: 3.8; }
.ring-fill { fill: none; stroke-width: 3.8; stroke-linecap: round; transition: stroke-dasharray 1s ease-out; }
.water-ring { stroke: #3b82f6; }
.ring-icon { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; }

/* Runner Emoji */
.steps-bar { position: relative; }
.steps-bar .fill { position: relative; transition: width 0.5s ease-out, background 0.5s ease; }
.steps-bar .fill::after {
  content: "🏃"; position: absolute; right: -12px; top: 50%; transform: translateY(-50%);
  font-size: 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); z-index: 2;
}

/* Water Glasses Animation */
.water-glass {
  background: transparent !important;
  border: 1px solid rgba(59,130,246,.3) !important;
  border-radius: 4px 4px 8px 8px !important;
}
.water-glass.filled::before {
  content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 85%;
  background: rgba(59,130,246,.8); border-radius: 0 0 6px 6px;
  animation: fillWater .4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes fillWater { from { height: 0; opacity: 0; } to { height: 85%; opacity: 1; } }

/* ============ CALENDAR GRID ============ */
.cal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: var(--card); border-radius: var(--r-md); border: 1px solid var(--border); margin-bottom: 16px; }
.cal-header button { font-size: 16px; width: 36px; height: 36px; border-radius: 50%; background: var(--bg-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text); }
.cal-header h3 { margin: 0; font-size: 16px; text-transform: capitalize; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 24px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
.cal-day { min-height: 80px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; cursor: pointer; position: relative; overflow: hidden; }
.cal-day.empty { background: transparent; border-color: transparent; cursor: default; min-height: 0; }
.cal-day.today { border-color: var(--fran); border-width: 2px; }
.cal-day.future { opacity: 0.5; pointer-events: none; }
.cal-day .d-num { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.cal-day-data { display: flex; flex-direction: column; gap: 2px; font-size: 11px; font-weight: 600; line-height: 1.2; }
.cal-day-data div { display: flex; justify-content: space-between; align-items: center; }
.cal-badges { display: flex; gap: 2px; flex-wrap: wrap; margin-top: auto; justify-content: flex-end; }
.cal-badges span { font-size: 10px; }
.cal-comments { display: flex; flex-direction: column; gap: 8px; }
.cal-comment-card { background: var(--card); padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.stats-card { background: var(--card); padding: 16px; border-radius: var(--r-md); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
.stats-card.full { grid-column: 1 / -1; }
.stats-val { font-size: 24px; font-weight: 800; color: var(--text); }
.stats-lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

/* ============ TOAST + CONFETTI ============ */
.toast-stack { position: fixed; bottom: calc(96px + var(--safe-bot)); left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 18px; border-radius: 14px;
  background: rgba(16,185,129,.95); color: #fff; font-weight: 700; font-size: 13px;
  box-shadow: 0 10px 30px rgba(16,185,129,.45);
  animation: toastIn .3s ease, toastOut .3s ease 2s forwards;
  display: flex; align-items: center; gap: 8px;
}
.toast.err { background: rgba(239,68,68,.95); box-shadow: 0 10px 30px rgba(239,68,68,.4); }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(20px); } }
.confetti {
  position: fixed; inset: 0; pointer-events: none; z-index: 1500; overflow: hidden;
}
.confetti span {
  position: absolute; width: 8px; height: 14px; top: -20px;
  animation: fall 1.8s linear forwards;
}
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

.section-title {
  font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin: 6px 0 14px;
}
.section-sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; margin-top: -8px; }

/* tiny utilities */
.row { display: flex; align-items: center; gap: 8px; }
.gap { flex: 1; }
.hidden { display: none !important; }
</style>
</head>

<script>
/* =============================================================
 * NUTRIAPP — single-file vanilla JS
 * ============================================================= */

const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DAY_SHORT = { Lunes:"Lun", Martes:"Mar", Miércoles:"Mié", Jueves:"Jue", Viernes:"Vie", Sábado:"Sáb", Domingo:"Dom" };

const GOALS = {
  fran: { kcal: 1900, prot: 140, carb: 200, fat: 65, name: "Fran" },
  lua:  { kcal: 1700, prot: 120, carb: 170, fat: 55, name: "Lúa" }
};

const CREDS = {
  fran: { pass: "admin2026", profile: "fran" },
  lua:  { pass: "lua2026",   profile: "lua"  }
};

/* ------------- STATE ------------- */
const AppState = {
  currentUser: null,
  activeProfile: "fran",
  plans: { fran: emptyPlan(), lua: emptyPlan() },
  entrenosDias: { fran: emptyEntrenos(), lua: emptyEntrenos() },
  shopChecked: {}, // ingredient name -> true
  trackers: { fran: { water: {}, steps: {} }, lua: { water: {}, steps: {} } },
  history: { fran: {}, lua: {} }, // YYYY-MM-DD -> { steps: 0, water: 0, trained: false, comments: {} }
  lastSync: 0,
  selectedDate: null, // YYYY-MM-DD
  progressMonth: null // YYYY-MM
};
function emptyPlan() {
  return {
    desayunoFijo: "",
    meriendasFijas: "",
    loadedAt: null,
    semana: DAYS.map(d => ({
      dia: d,
      comida: emptyMeal(),
      cena: emptyMeal(),
      meriendaEspecial: ""
    }))
  };
}
function emptyMeal() { return { nombre: "", ingredientes: [], calorias: 0, proteinas: 0, carbohidratos: 0, grasas: 0, comments: "" }; }
function emptyEntrenos() { return Object.fromEntries(DAYS.map(d => [d, false])); }

function currentDateKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function currentWeekKey() {
  // Devuelve la fecha (YYYY-MM-DD) del lunes de la semana actual
  const now = new Date();
  const dow = (now.getDay() + 6) % 7; // 0=Lun, 6=Dom
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
  const yyyy = mon.getFullYear();
  const mm = String(mon.getMonth() + 1).padStart(2, "0");
  const dd = String(mon.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

/* ------------- PERSISTENCE ------------- */
function loadAll() {
  try {
    const sess = JSON.parse(localStorage.getItem("nutri_session") || "null");
    if (sess?.user) AppState.currentUser = sess.user;
    const data = JSON.parse(localStorage.getItem("nutri_app_data") || "null");
    if (data?.plans) AppState.plans = mergePlans(data.plans);
    if (data?.activeProfile) AppState.activeProfile = data.activeProfile;
    if (data?.trackers) AppState.trackers = data.trackers;
    if (data?.history) AppState.history = data.history;
    const ent = JSON.parse(localStorage.getItem("nutri_entrenos") || "null");
    if (ent) AppState.entrenosDias = { fran: { ...emptyEntrenos(), ...(ent.fran||{}) }, lua: { ...emptyEntrenos(), ...(ent.lua||{}) } };
    // Auto-reset entrenos al inicio de cada semana (lunes)
    const wk = currentWeekKey();
    const savedWk = localStorage.getItem("nutri_entrenos_fecha");
    if (savedWk !== wk) {
      AppState.entrenosDias = { fran: emptyEntrenos(), lua: emptyEntrenos() };
      localStorage.setItem("nutri_entrenos_fecha", wk);
      localStorage.setItem("nutri_entrenos", JSON.stringify(AppState.entrenosDias));
    }
    const shop = JSON.parse(localStorage.getItem("nutri_shop_checked") || "null");
    if (shop) AppState.shopChecked = shop;
  } catch (e) { console.warn("load failed", e); }
}
function mergePlans(p) {
  const out = { fran: emptyPlan(), lua: emptyPlan() };
  for (const k of ["fran","lua"]) {
    if (p[k]) {
      out[k] = { ...emptyPlan(), ...p[k] };
      out[k].semana = DAYS.map((d, i) => ({
        dia: d,
        comida: { ...emptyMeal(), ...(p[k].semana?.[i]?.comida || {}) },
        cena: { ...emptyMeal(), ...(p[k].semana?.[i]?.cena || {}) },
        meriendaEspecial: p[k].semana?.[i]?.meriendaEspecial || ""
      }));
    }
  }
  return out;
}
function saveAll() {
  localStorage.setItem("nutri_app_data", JSON.stringify({ plans: AppState.plans, activeProfile: AppState.activeProfile, trackers: AppState.trackers, history: AppState.history }));
  localStorage.setItem("nutri_entrenos", JSON.stringify(AppState.entrenosDias));
  localStorage.setItem("nutri_entrenos_fecha", currentWeekKey());
  localStorage.setItem("nutri_shop_checked", JSON.stringify(AppState.shopChecked));
}
function saveSession(user) { localStorage.setItem("nutri_session", JSON.stringify({ user })); }
function clearSession() { localStorage.removeItem("nutri_session"); }

/* ------------- THEME ------------- */
function applyTheme(t) {
  document.body.classList.toggle("dark", t === "dark");
  const meta = document.getElementById("theme-color-meta");
  if (meta) meta.setAttribute("content", t === "dark" ? "#0f172a" : "#f8fafc");
  const btn = document.getElementById("theme-btn");
  if (btn) btn.textContent = t === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  const cur = localStorage.getItem("nutri_theme") || "light";
  const next = cur === "dark" ? "light" : "dark";
  localStorage.setItem("nutri_theme", next);
  applyTheme(next);
}

/* ------------- LOGIN ------------- */
function doLogin() {
  const u = document.getElementById("login-user").value.trim().toLowerCase();
  const p = document.getElementById("login-pass").value;
  const err = document.getElementById("login-error");
  const cred = CREDS[u];
  if (!cred || cred.pass !== p) {
    err.textContent = "Usuario o contraseña incorrectos";
    err.classList.remove("hidden");
    err.style.animation = "none"; void err.offsetWidth; err.style.animation = "";
    return;
  }
  err.classList.add("hidden");
  AppState.currentUser = u;
  AppState.activeProfile = cred.profile;
  saveSession(u);
  saveAll();
  showApp();
}
function doLogout() {
  clearSession();
  AppState.currentUser = null;
  document.getElementById("app").classList.remove("show");
  document.getElementById("login").style.display = "grid";
  document.getElementById("login-user").value = "";
  document.getElementById("login-pass").value = "";
}
function showApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").classList.add("show");
  applyProfileTheme();
  render();
}
function applyProfileTheme() {
  document.body.classList.toggle("profile-lua", AppState.activeProfile === "lua");
  document.body.classList.toggle("profile-fran", AppState.activeProfile === "fran");
  document.querySelectorAll(".profile-tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.prof === AppState.activeProfile);
  });
  document.getElementById("brand-sub").textContent =
    `Sesión: ${CREDS[AppState.currentUser]?.profile === "fran" ? "Fran" : "Lúa"} · viendo: ${GOALS[AppState.activeProfile].name}`;
}

/* ------------- NAV ------------- */
function setSection(name) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById("sec-" + name).classList.add("active");
  document.querySelectorAll(".bottomnav button").forEach(b => b.classList.toggle("active", b.dataset.sec === name));
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* ------------- RENDER (router) ------------- */
function render() {
  applyProfileTheme();
  renderNutri();
  renderShop();
  renderProgress();
  renderStats();
  renderImport();
}

/* ============================================================= */
/* NUTRICIÓN                                                       */
/* ============================================================= */
function renderNutri() {
  const root = document.getElementById("nutri-content");
  const prof = AppState.activeProfile;
  const plan = AppState.plans[prof];
  const goals = GOALS[prof];
  const totals = weekTotals(plan);
  const initial = goals.name[0];
  
  const sel = AppState.selectedDay || todayDay();
  AppState.selectedDay = sel;
  const day = plan.semana.find(d => d.dia === sel) || plan.semana[0];
  
  const exactDate = getDateForDay(day.dia);
  
  const dt = dayTotals(day);
  const meriendaSpecial = day.meriendaEspecial && plan.meriendasFijas && day.meriendaEspecial.trim() !== plan.meriendasFijas.trim();

  if (!AppState.history) AppState.history = { fran: {}, lua: {} };
  if (!AppState.history[prof][exactDate]) AppState.history[prof][exactDate] = { steps: 0, water: 0, trained: false, comments: {} };
  const hData = AppState.history[prof][exactDate];
  const water = hData.water || 0;
  const steps = hData.steps || 0;
  const tr = hData.trained || false;
  
  const stepGoal = 12000;
  const stepPct = Math.min(100, (steps / stepGoal) * 100);
  let stepColor = "#f59e0b"; // Naranja
  if (steps >= 6000) stepColor = "#86efac"; // Verde claro
  if (steps >= 10000) stepColor = "#10b981"; // Verde intenso
  if (steps >= 12000) stepColor = "#fbbf24"; // Amarillo brillante/estrella
  
  const waterPct = Math.min(100, (water / 8) * 100);

  root.innerHTML = `
    <section class="profile-summary">
      <div class="avatar">${initial}</div>
      <div class="who">
        <h2>${goals.name}</h2>
        <p>Objetivo: ${goals.kcal} kcal · ${goals.prot}g proteína / día</p>
      </div>
      
      <!-- Rings (Estilo Apple Watch) -->
      <div class="rings-widget">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 36 36">
            <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="ring-fill water-ring" stroke-dasharray="${waterPct}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <div class="ring-icon">💧</div>
        </div>
        <div class="ring-wrap">

function estimateKcalFromText(text) {
  if (!text) return null;
  const lower = text.toLowerCase();
  // Busca patrones: "200g de pollo", "pollo 150g", "2 huevos", etc.
  const entries = [];
  const regexGrams = /(\d+)\s*g(?:ramos?)?\s+(?:de\s+)?([a-záéíóúüñ\s]+)/gi;
  const regexOf = /([a-záéíóúüñ\s]+?)\s+(\d+)\s*g/gi;
  const regexUnits = /(\d+)\s+(?:racion(?:es)?|huevos?|filetes?|latas?|yogures?)/gi;

  let match;
  while ((match = regexGrams.exec(lower)) !== null) {
    const grams = parseInt(match[1]);
    const food = match[2].trim().replace(/\s+/g, ' ');
    entries.push({ food, grams });
  }
  while ((match = regexOf.exec(lower)) !== null) {
    const food = match[1].trim().replace(/\s+/g, ' ');
    const grams = parseInt(match[2]);
    if (!entries.find(e => e.food === food)) entries.push({ food, grams });
  }

  // Sin gramos: busca palabras clave y asume porciones estándar
  if (!entries.length) {
    for (const [key, kcalPer100] of Object.entries(FOOD_KCAL)) {
      if (lower.includes(key)) {
        const stdGrams = ["arroz","pasta","avena","copos"].includes(key) ? 60 :
                         ["patata","boniato"].includes(key) ? 200 :
                         ["aceite","aceite de oliva","mantequilla"].includes(key) ? 15 :
                         ["huevo","huevos"].includes(key) ? 110 :
                         ["yogur"].includes(key) ? 125 :
                         ["pizza"].includes(key) ? 250 :
                         ["queso fresco","cottage"].includes(key) ? 100 :
                         ["queso","mozzarella"].includes(key) ? 30 : 150;
        entries.push({ food: key, grams: stdGrams });
      }
    }
  }

  if (!entries.length) return null;

  let totalKcal = 0;
  const breakdown = [];
  for (const { food, grams } of entries) {
    // Match more flexible
    let kcalPer100 = null;
    for (const [key, val] of Object.entries(FOOD_KCAL)) {
      if (food.includes(key) || key.includes(food.split(' ')[0])) { kcalPer100 = val; break; }
    }
    if (!kcalPer100) continue;
    const kcal = Math.round((kcalPer100 * grams) / 100);
    totalKcal += kcal;
    breakdown.push(`${food} ${grams}g → ${kcal} kcal`);
  }
  return totalKcal > 0 ? { total: totalKcal, breakdown } : null;
}

/* VARIANT DETECTION — proteína/carbohidrato alternativo         */
/* ============================================================= */
const PROTEIN_VARIANTS = [
  { match: /pollo/i,    label: "Pollo",   macroBase: { kcalPer100: 165, protPer100: 31, carbPer100: 0, fatPer100: 3.6 } },
  { match: /pavo/i,     label: "Pavo",    macroBase: { kcalPer100: 135, protPer100: 29, carbPer100: 0, fatPer100: 1.7 } },
  { match: /pescado|merluza|dorada/i, label: "Pescado blanco", macroBase: { kcalPer100: 82, protPer100: 18, carbPer100: 0, fatPer100: 1 } },
  { match: /salm[oó]n/i, label: "Salmón", macroBase: { kcalPer100: 208, protPer100: 20, carbPer100: 0, fatPer100: 13 } },
  { match: /at[uú]n/i,  label: "Atún",   macroBase: { kcalPer100: 132, protPer100: 28, carbPer100: 0, fatPer100: 1 } },
  { match: /ternera|res/i, label: "Ternera", macroBase: { kcalPer100: 215, protPer100: 26, carbPer100: 0, fatPer100: 11 } },
];
const CARB_VARIANTS = [
  { match: /patata/i,  label: "Patata",  macroBase: { kcalPer100: 77, protPer100: 2, carbPer100: 17, fatPer100: 0.1 } },
  { match: /boniato/i, label: "Boniato", macroBase: { kcalPer100: 86, protPer100: 1.6, carbPer100: 20, fatPer100: 0.1 } },
  { match: /arroz/i,   label: "Arroz",   macroBase: { kcalPer100: 130, protPer100: 2.7, carbPer100: 28, fatPer100: 0.3 } },
  { match: /pasta/i,   label: "Pasta",   macroBase: { kcalPer100: 131, protPer100: 5, carbPer100: 25, fatPer100: 1.1 } },
];

function detectVariants(nombre) {
  if (!nombre) return { proteins: [], carbs: [] };
  const proteins = [], carbs = [];
  // Si hay "/" en el nombre, detectamos opciones
  const parts = nombre.split(/\/|\s+o\s+/i);
  for (const p of parts) {
    const trimmed = p.trim();
    for (const pv of PROTEIN_VARIANTS) {
      if (pv.match.test(trimmed) && !proteins.find(x => x.label === pv.label)) {
        proteins.push(pv);
      }
    }
    for (const cv of CARB_VARIANTS) {
      if (cv.match.test(trimmed) && !carbs.find(x => x.label === cv.label)) {
        carbs.push(cv);
      }
    }
  }
  return { proteins, carbs };
}

function computeVariantMacros(meal, protLabel, carbLabel) {
  // Estima macros según la variante seleccionada
  const pv = PROTEIN_VARIANTS.find(x => x.label === protLabel);
  const cv = CARB_VARIANTS.find(x => x.label === carbLabel);
  const protGrams = 200; // porción estándar proteína
  const carbGrams = 250; // porción estándar carbohidrato

  let kcal = meal.calorias || 0;
  let prot = meal.proteinas || 0;
  let carb = meal.carbohidratos || 0;
  let fat  = meal.grasas || 0;

  // Si no hay macros ya definidas, estima desde las variantes
  if (!kcal && pv) {
    kcal = Math.round((pv.macroBase.kcalPer100 * protGrams / 100) + (cv ? cv.macroBase.kcalPer100 * carbGrams / 100 : 0));
    prot = Math.round(pv.macroBase.protPer100 * protGrams / 100);
    carb = Math.round((cv ? cv.macroBase.carbPer100 * carbGrams / 100 : 0));
    fat  = Math.round(pv.macroBase.fatPer100 * protGrams / 100);
  }
  return { kcal, prot, carb, fat };
}

  const icon = slot === "comida" ? "🍽️" : "🌙";
  const label = slot === "comida" ? "Comida" : "Cena";

  // Detectar variantes
  const { proteins, carbs } = detectVariants(m.nombre);
  const hasVariants = proteins.length > 1 || carbs.length > 1;

  // Variante seleccionada (guardada en history)
  const selProt = hData.variantProt?.[slot] || (proteins[0]?.label || "");
  const selCarb = hData.variantCarb?.[slot] || (carbs[0]?.label || "");

  // Construir nombre de display limpio (sin las barras)

  const diaryHtml = comments ? `

      📝 <b>Diario:</b> ${escapeHtml(comments)}

      ${variantHtml}
      <div class="meal-macros">
        <span class="chip kcal">🔥 ${displayKcal} kcal</span>
        <span class="chip prot">Prot: ${displayProt}g</span>
        <span class="chip carb">Carb: ${displayCarb}g</span>
        <span class="chip fat">Grasas: ${displayFat}g</span>

        <button data-act="swap"   data-slot="${slot}">🔄 Intercambiar</button>

function dayTotals(day) {
  const a = day.comida, b = day.cena;
  return {
    kcal: (a.calorias||0) + (b.calorias||0),
    prot: (a.proteinas||0) + (b.proteinas||0),
    carb: (a.carbohidratos||0) + (b.carbohidratos||0),
    fat:  (a.grasas||0) + (b.grasas||0)
  };
}
function weekTotals(plan) {
  return plan.semana.reduce((acc, d) => {
    const t = dayTotals(d);
    acc.kcal += t.kcal; acc.prot += t.prot; acc.carb += t.carb; acc.fat += t.fat;
    return acc;
  }, { kcal: 0, prot: 0, carb: 0, fat: 0 });
}

function getDateForDay(dayName) {
  const monKey = currentWeekKey();
  const [yyyy, mm, dd] = monKey.split("-").map(Number);
  const monDate = new Date(yyyy, mm - 1, dd);
  const idx = DAYS.indexOf(dayName);
  if (idx < 0) return monKey;
  const tDate = new Date(monDate.getFullYear(), monDate.getMonth(), monDate.getDate() + idx);
  return `${tDate.getFullYear()}-${String(tDate.getMonth() + 1).padStart(2, "0")}-${String(tDate.getDate()).padStart(2, "0")}`;
}

function onCalClick(e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const slot = t.dataset.slot;
  const prof = AppState.activeProfile;
  
  const targetDay = t.dataset.day || t.closest(".meal-card")?.dataset.day || AppState.selectedDay || todayDay();
  
  const exactWrap = t.closest("[data-exactdate]");
  const exactDate = exactWrap ? exactWrap.dataset.exactdate : getDateForDay(targetDay);
  
  if (!AppState.history[prof][exactDate]) {
    let defaultTr = false;
    if (prof === "fran") {
      const dObj = new Date(exactDate);
      const dow = dObj.getDay();
      if (dow >= 1 && dow <= 5) defaultTr = true;
    }
    AppState.history[prof][exactDate] = { steps: 0, water: 0, trained: defaultTr, comments: {} };
  }
  const hData = AppState.history[prof][exactDate];

  let shouldRerenderModal = false;

  if (act === "toggle-train") {
    hData.trained = !hData.trained;
    saveAll(); syncToGithub(); render();
    shouldRerenderModal = true;
  } else if (act === "water-add") {
    hData.water = (hData.water || 0) + 1;
    saveAll(); syncToGithub(); render();
    shouldRerenderModal = true;
  } else if (act === "water-sub") {
    hData.water = Math.max(0, (hData.water || 0) - 1);
    saveAll(); syncToGithub(); render();
    shouldRerenderModal = true;
  } else if (act === "steps-add") {
    const val = parseInt(t.dataset.val, 10);
    hData.steps = (hData.steps || 0) + val;
    saveAll(); syncToGithub(); render();
    shouldRerenderModal = true;
  } else if (act === "day-detail") {
    openDayDrawer(AppState.plans[prof].semana.find(d => d.dia === targetDay)?.dia || DAYS[0]);
  } else if (act === "set-prot") {
    if (!AppState.history[prof][exactDate].variantProt) AppState.history[prof][exactDate].variantProt = {};
    AppState.history[prof][exactDate].variantProt[slot] = t.dataset.val;
    saveAll(); render();
  } else if (act === "set-carb") {
    if (!AppState.history[prof][exactDate].variantCarb) AppState.history[prof][exactDate].variantCarb = {};
    AppState.history[prof][exactDate].variantCarb[slot] = t.dataset.val;
    saveAll(); render();
  } else if (act === "log-comment") {
    openCommentModal(slot, exactDate);
  } else if (act === "swap") {
    openSwapModal(AppState.plans[prof].semana.find(d => d.dia === targetDay)?.dia || DAYS[0], slot);
  } else if (act === "subst") {
    openSubstModal(AppState.plans[prof].semana.find(d => d.dia === targetDay)?.dia || DAYS[0], slot);
  } else if (act === "edit") {
    openEditModal(AppState.plans[prof].semana.find(d => d.dia === targetDay)?.dia || DAYS[0], slot);
  }

  if (shouldRerenderModal && exactWrap && exactWrap.id === "modal-trackers-wrap") {
    exactWrap.innerHTML = getTrackersHtml(exactDate, prof, targetDay);
  }
}

// Búsqueda tolerante: devuelve candidatos ordenados por relevancia
function searchFoodDB(query) {
  if (!query || query.length < 2) return [];
  const q = query.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return FOOD_DB
    .map(f => {
      const name = f.n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      let score = 0;
      if (name === q) score = 100;
      else if (name.startsWith(q)) score = 80;
      else if (name.includes(q)) score = 60;
      else if (q.split(" ").some(w => w.length > 2 && name.includes(w))) score = 30;
      return { ...f, score };
    })
    .filter(f => f.score > 0)
    .sort((a,b) => b.score - a.score)
    .slice(0, 6);
}

// Calcula macros de una lista de entradas {food, grams}
function calcMacrosFromEntries(entries) {
  let kcal = 0, prot = 0, carb = 0, fat = 0;
  const lines = [];
  for (const e of entries) {
    if (!e.food || !e.grams || e.grams <= 0) continue;
    const f = FOOD_DB.find(x => x.n === e.food);
    if (!f) continue;
    const factor = e.grams / 100;
    const eKcal = Math.round(f.k * factor);
    const eProt = Math.round(f.p * factor * 10) / 10;
    const eCarb = Math.round(f.c * factor * 10) / 10;
    const eFat  = Math.round(f.g * factor * 10) / 10;
    kcal += eKcal; prot += eProt; carb += eCarb; fat += eFat;
    lines.push(`${e.food} ${e.grams}g → ${eKcal} kcal`);
  }
  return { kcal: Math.round(kcal), prot: Math.round(prot*10)/10, carb: Math.round(carb*10)/10, fat: Math.round(fat*10)/10, lines };
}

// Convierte entries a texto legible para guardar en comments
function entriesToText(entries) {
  return entries.filter(e => e.food && e.grams > 0).map(e => `${e.food} (${e.grams}g)`).join(", ");
}

function openCommentModal(slot, exactDate) {
  const prof = AppState.activeProfile;
  const hData = AppState.history[prof][exactDate] || {};
  if (!AppState.history[prof][exactDate]) AppState.history[prof][exactDate] = { steps: 0, water: 0, trained: false, comments: {} };
  if (!AppState.history[prof][exactDate].comments) AppState.history[prof][exactDate].comments = {};
  if (!AppState.history[prof][exactDate].diaryKcal) AppState.history[prof][exactDate].diaryKcal = {};

  // Estado local: lista de alimentos añadidos
  let entries = AppState.history[prof][exactDate].diaryEntries?.[slot] || [{ food: "", grams: 0 }];
  if (!entries.length) entries = [{ food: "", grams: 0 }];
  entries = entries.map(e => ({ ...e })); // clon

  function buildModal() {
    const macros = calcMacrosFromEntries(entries);
    const hasData = macros.kcal > 0;

    const rowsHtml = entries.map((e, i) => `
      <div class="diary-row" data-idx="${i}">
        <div class="diary-row-inputs">
          <div class="diary-qty-wrap">
            <input class="diary-qty" type="number" min="1" max="2000" placeholder="g"
              value="${e.grams || ""}" data-role="qty" data-idx="${i}" />
            <span class="diary-qty-unit">g</span>
          </div>
          <div class="diary-food-wrap">
            <input class="diary-food-input" type="text" placeholder="Alimento…"
              value="${escapeHtml(e.food)}" data-role="food" data-idx="${i}" autocomplete="off" />
            <div class="diary-suggestions" id="sug-${i}" style="display:none"></div>
          </div>
          <button class="diary-rm" data-role="rm" data-idx="${i}" title="Eliminar"${entries.length===1?' style="opacity:.3;pointer-events:none"':''}>✕</button>
        </div>
        ${e.food && FOOD_DB.find(x=>x.n===e.food) && e.grams > 0 ? (() => {
          const f = FOOD_DB.find(x=>x.n===e.food);
          const factor = e.grams/100;
          return `<div class="diary-row-macro">
            🔥${Math.round(f.k*factor)} kcal · P${Math.round(f.p*factor*10)/10}g · C${Math.round(f.c*factor*10)/10}g · G${Math.round(f.g*factor*10)/10}g
          </div>`;
        })() : ''}
      </div>
    `).join("");

    const summaryHtml = hasData ? `
      <div class="diary-summary">
        <div class="diary-summary-title">📊 Total estimado</div>
        <div class="diary-summary-macros">
          <span class="chip kcal">🔥 ${macros.kcal} kcal</span>
          <span class="chip prot">P ${macros.prot}g</span>
          <span class="chip carb">C ${macros.carb}g</span>
          <span class="chip fat">G ${macros.fat}g</span>
        </div>
      </div>
    ` : `<div class="diary-hint">💡 Añade alimentos y gramos para calcular las calorías exactas.</div>`;

    openModal(`
      <h3>📝 Diario Real · ${slot === 'comida' ? '🍽️ Comida' : '🌙 Cena'}</h3>
      <p class="sub">Añade cada alimento con su cantidad en gramos.</p>
      <div class="diary-rows" id="diary-rows">${rowsHtml}</div>
      <button class="diary-add-row" id="diary-add-row">+ Añadir alimento</button>
      ${summaryHtml}
      <div class="actions" style="margin-top:14px">
        <button class="btn-cancel" data-x="cancel">Cancelar</button>
        <button class="btn-confirm" data-x="save-diary">💾 Guardar</button>
      </div>
    `);

    // Bind events
    const mb = document.getElementById("modal-body");

    // Add row
    document.getElementById("diary-add-row").onclick = () => {
      entries.push({ food: "", grams: 0 });
      buildModal();
    };

    // Remove row
    mb.querySelectorAll("[data-role='rm']").forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx);
        entries.splice(idx, 1);
        if (!entries.length) entries.push({ food: "", grams: 0 });
        buildModal();
      };
    });

    // Qty input
    mb.querySelectorAll("[data-role='qty']").forEach(inp => {
      inp.oninput = () => {
        const idx = parseInt(inp.dataset.idx);
        entries[idx].grams = parseInt(inp.value) || 0;
        // Redibuja solo el macro de esa fila
        buildModal();
      };
    });

    // Food input + autocomplete
    mb.querySelectorAll("[data-role='food']").forEach(inp => {
      const idx = parseInt(inp.dataset.idx);
      const sugBox = document.getElementById(`sug-${idx}`);

      inp.oninput = () => {
        entries[idx].food = inp.value;
        const results = searchFoodDB(inp.value);
        if (results.length && inp.value.length >= 2) {
          sugBox.innerHTML = results.map(r =>
            `<div class="diary-sug-item" data-food="${escapeHtml(r.n)}">
              <span class="sug-name">${escapeHtml(r.n)}</span>
              <span class="sug-macro">🔥${r.k} · P${r.p} · C${r.c} · G${r.g} <small>/ 100g</small></span>
            </div>`
          ).join("");
          sugBox.style.display = "block";
        } else {
          sugBox.style.display = "none";
        }
      };

      sugBox?.addEventListener("click", e => {
        const item = e.target.closest(".diary-sug-item");
        if (!item) return;
        entries[idx].food = item.dataset.food;
        buildModal();
        // Foco al qty del siguiente campo
        requestAnimationFrame(() => {
          const allQty = document.querySelectorAll("[data-role='qty']");
          if (allQty[idx]) allQty[idx].focus();
        });
      });
    });

    // Cancel / Save
    mb.addEventListener("click", e => {
      if (e.target.dataset.x === "cancel") return closeModal();
      if (e.target.dataset.x === "save-diary") {
        const validEntries = entries.filter(e => e.food && e.grams > 0);
        const macros = calcMacrosFromEntries(validEntries);
        const h = AppState.history[prof][exactDate];
        h.comments[slot] = entriesToText(validEntries);
        if (!h.diaryKcal) h.diaryKcal = {};
        h.diaryKcal[slot] = macros.kcal;
        if (!h.diaryMacros) h.diaryMacros = {};
        h.diaryMacros[slot] = { prot: macros.prot, carb: macros.carb, fat: macros.fat };
        if (!h.diaryEntries) h.diaryEntries = {};
        h.diaryEntries[slot] = validEntries;
        saveAll(); syncToGithub(); closeModal(); render();
      }
    });
  }

  buildModal();
}

function openSwapModal(day, slot) {
  let mode = "this"; // 'this' or 'full'
  let target = null;
  const plan = AppState.plans[AppState.activeProfile];

  function paint() {
    openModal(`
      <h3>🔄 Intercambiar ${slot === "cena" ? "Cena" : "Comida"} del ${day}</h3>
      <p class="sub">Elige otro día para intercambiar.</p>
      <div class="seg">
        <button data-mode="this" class="${mode==='this'?'active':''}">Solo esta toma</button>
        <button data-mode="full" class="${mode==='full'?'active':''}">Día completo</button>
      </div>
      <div class="day-grid">
        ${plan.semana.filter(d => d.dia !== day).map(d => `
          <button class="day-pick${target===d.dia?' selected':''}" data-target="${d.dia}">
            <div class="dn">${DAY_SHORT[d.dia]}</div>
            <div class="pn">${escapeHtml(mode === "full" ? (d.comida.nombre || "—") + " · " + (d.cena.nombre || "—") : (d[slot].nombre || "—"))}</div>
          </button>
        `).join("")}
      </div>
      <div class="actions">
        <button class="btn-cancel" data-x="cancel">Cancelar</button>
        <button class="btn-confirm" data-x="ok" ${target?'':'disabled style="opacity:.5"'}>Confirmar</button>
      </div>
    `);
    document.getElementById("modal-body").addEventListener("click", e => {
      const seg = e.target.closest("[data-mode]");
      if (seg) { mode = seg.dataset.mode; paint(); return; }
      const tgt = e.target.closest("[data-target]");
      if (tgt) { target = tgt.dataset.target; paint(); return; }
      if (e.target.dataset.x === "cancel") closeModal();
      if (e.target.dataset.x === "ok" && target) {
        const a = plan.semana.find(d => d.dia === day);
        const b = plan.semana.find(d => d.dia === target);
        if (mode === "this") {
          [a[slot], b[slot]] = [b[slot], a[slot]];
        } else {
          [a.comida, b.comida] = [b.comida, a.comida];
          [a.cena, b.cena] = [b.cena, a.cena];
        }
        saveAll(); syncToGithub(); closeModal(); render();
        toast(`✅ Intercambiado: ${day} ↔ ${target}`);
      }
    });
  }
  paint();
}

<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f4f6fb" id="theme-color-meta">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>NutriPlan 🥗</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Outfit',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.45;transition:background .4s ease,color .3s ease;background-attachment:fixed!important}
body.profile-fran{background:radial-gradient(circle at 12% 8%,rgba(79,143,247,.10),transparent 42%),radial-gradient(circle at 88% 22%,rgba(56,189,248,.09),transparent 46%),var(--bg)}
body.profile-lua{background:radial-gradient(circle at 12% 8%,rgba(45,212,191,.12),transparent 42%),radial-gradient(circle at 88% 22%,rgba(244,114,182,.10),transparent 46%),var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
input:focus,textarea:focus,button:focus,select:focus{outline:none}
::-webkit-scrollbar{width:0;height:0}

:root{
--bg:#f4f6fb;--bg-2:#e9edf5;
--card:rgba(255,255,255,.72);--card-2:rgba(248,250,253,.62);--card-solid:#ffffff;
--border:rgba(255,255,255,.62);--border-2:rgba(148,163,184,.28);
--text:#1f2733;--muted:#62718a;--dim:#97a3b6;
--topbar-bg:rgba(255,255,255,.7);--nav-bg:rgba(255,255,255,.82);
--modal-backdrop:rgba(20,28,42,.42);
--shadow-card:0 6px 24px rgba(30,41,59,.07);--shadow-lg:0 24px 56px rgba(30,41,59,.16);
--kcal:#f59e0b;--prot:#ef5350;--carb:#fb8c3b;--fat:#4f8ff7;
--ok:#22c55e;--warn:#f97316;--danger:#ef4444;
--fran:#4f8ff7;--lua:#2dd4bf;--accent:var(--fran);
--track:rgba(148,163,184,.18);
--r-sm:10px;--r-md:14px;--r-lg:16px;--r-xl:22px;
--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
body.dark{
--bg:#11161f;--bg-2:#0d121a;
--card:rgba(30,38,52,.6);--card-2:rgba(38,48,66,.5);--card-solid:#1b2433;
--border:rgba(255,255,255,.07);--border-2:rgba(100,116,139,.32);
--text:#e7edf6;--muted:#9aa7b8;--dim:#6b7787;
--topbar-bg:rgba(17,22,31,.72);--nav-bg:rgba(17,22,31,.85);
--modal-backdrop:rgba(4,8,15,.7);
--shadow-card:0 8px 32px rgba(0,0,0,.4);--shadow-lg:0 24px 64px rgba(0,0,0,.6);
--kcal:#fbbf24;--prot:#f87171;--carb:#fb9a4b;--fat:#6ea8fe;
--ok:#34d399;--track:rgba(148,163,184,.16);
}
body.profile-lua{--accent:var(--lua)}

/* LOGIN */
.login{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:9999;
background:radial-gradient(900px 500px at 12% -10%,rgba(79,143,247,.28),transparent 60%),radial-gradient(800px 460px at 110% 110%,rgba(34,197,94,.2),transparent 55%),linear-gradient(135deg,#0a1322,#11161f 55%,#13233a);
background-size:200% 200%;animation:bgshift 18s ease-in-out infinite}
@keyframes bgshift{0%,100%{background-position:0 0,100% 100%,0 0}50%{background-position:30% 20%,70% 80%,100% 100%}}
.login-card{width:min(400px,100%);padding:34px 26px 26px;border-radius:24px;background:linear-gradient(180deg,rgba(30,41,59,.6),rgba(15,23,42,.5));border:1px solid rgba(148,163,184,.18);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:var(--shadow-lg);animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.login .mark{font-size:52px;text-align:center;display:block;filter:drop-shadow(0 6px 14px rgba(34,197,94,.35))}
.login h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:8px;text-align:center;background:linear-gradient(135deg,#34d399,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.login p.sub{color:#9fb0c7;text-align:center;margin-top:4px;font-size:14px;margin-bottom:22px}
.who-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who-btn{padding:18px 12px;border-radius:16px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16);color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .12s,border-color .2s,background .2s}
.who-btn:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.who-btn .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff}
.who-btn .av.fran{background:linear-gradient(135deg,#2563eb,#4f8ff7)}
.who-btn .av.lua{background:linear-gradient(135deg,#0d9488,#2dd4bf)}
.who-btn .nm{font-weight:700;font-size:15px}

/* APP SHELL */
.app{display:none;min-height:100%;padding-top:calc(60px + var(--safe-top));padding-bottom:calc(76px + var(--safe-bot))}
.app.show{display:block}
.topbar{position:fixed;top:0;left:0;right:0;height:calc(60px + var(--safe-top));padding-top:var(--safe-top);background:var(--topbar-bg);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding-left:14px;padding-right:14px;z-index:100}
.topbar .brand{font-weight:800;font-size:16px;letter-spacing:-.01em}
.topbar .brand small{color:var(--muted);font-weight:500;font-size:11px;display:block;margin-top:1px}
.profile-tabs{margin-left:auto;margin-right:auto;display:flex;gap:4px;background:var(--bg-2);border:1px solid var(--border);border-radius:999px;padding:3px}
.profile-tabs button{padding:6px 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);transition:color .2s,background .2s;display:flex;align-items:center;gap:6px}
.profile-tabs button .dot{width:8px;height:8px;border-radius:50%}
.profile-tabs button[data-prof=fran] .dot{background:var(--fran)}
.profile-tabs button[data-prof=lua] .dot{background:var(--lua)}
.profile-tabs button.active[data-prof=fran]{background:rgba(79,143,247,.16);color:var(--fran)}
.profile-tabs button.active[data-prof=lua]{background:rgba(45,212,191,.16);color:#0d9488}
body.dark .profile-tabs button.active[data-prof=lua]{color:#5eead4}
.btn-theme,.btn-logout{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:16px;display:grid;place-items:center;flex:none;color:var(--muted)}
.btn-theme:hover,.btn-logout:hover{color:var(--text);border-color:var(--border-2)}

/* BOTTOM NAV */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(76px + var(--safe-bot));padding-bottom:var(--safe-bot);background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;z-index:100}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px;font-weight:600;position:relative;transition:color .2s}
.nav button .glyph{font-size:22px;line-height:1;transition:transform .2s}
.nav button.active{color:var(--accent)}
.nav button.active .glyph{transform:translateY(-2px) scale(1.05)}
.nav button.active::before{content:"";position:absolute;top:6px;width:34px;height:4px;border-radius:4px;background:var(--accent)}

.section{display:none;padding:14px 12px 28px;max-width:680px;margin:0 auto}
.section.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-card)}
.section-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:18px 4px 8px}

/* PROFILE SUMMARY */
.psum{display:flex;gap:14px;align-items:center;padding:16px 18px;margin-bottom:14px}
.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;flex:none;box-shadow:0 8px 18px rgba(0,0,0,.12)}
.avatar.fran{background:linear-gradient(135deg,#2563eb,#4f8ff7)}
.avatar.lua{background:linear-gradient(135deg,#0d9488,#2dd4bf)}
.psum .who h2{font-size:18px;font-weight:800}
.psum .who p{font-size:12px;color:var(--muted)}
.train-toggle-wrap{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.train-toggle-wrap span{font-size:10px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.04em}
.toggle{width:42px;height:24px;border-radius:999px;background:var(--track);position:relative;transition:background .25s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.toggle.on{background:linear-gradient(135deg,var(--warn),#ef4444)}
.toggle.on::after{transform:translateX(18px)}

/* MACRO RING */
.ring-card{padding:18px;margin-bottom:14px;display:flex;gap:16px;align-items:center}
.ring-wrap{position:relative;flex:none}
.ring-wrap svg{display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center .big{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.ring-center .sub{font-size:11px;color:var(--muted);margin-top:2px}
.macro-bars{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.mbar .top{display:flex;justify-content:space-between;font-size:12px}
.mbar .top b{font-weight:700}
.mbar .top span{color:var(--muted)}
.mbar .bar{height:6px;border-radius:99px;background:var(--track);margin-top:3px;overflow:hidden}
.mbar .fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.9,.3,1)}

/* MEAL CARDS */
.meal{padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.meal[data-type=desayuno]{border-left:3px solid #fbbf24}
.meal[data-type=comida]{border-left:3px solid var(--carb)}
.meal[data-type=cena]{border-left:3px solid #818cf8}
.meal[data-type=merienda]{border-left:3px solid #34d399}
.meal-head{display:flex;align-items:center;gap:10px}
.meal-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none}
.meal[data-type=desayuno] .meal-ico{background:rgba(251,191,36,.14)}
.meal[data-type=comida] .meal-ico{background:rgba(251,140,59,.14)}
.meal[data-type=cena] .meal-ico{background:rgba(129,140,248,.14)}
.meal[data-type=merienda] .meal-ico{background:rgba(52,211,153,.14)}
.meal-head .label{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.meal-head .done-btn{margin-left:auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:var(--dim);border:1.5px solid var(--border-2);transition:all .2s;flex:none}
.meal-head .done-btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.meal-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.meal-name.empty{color:var(--dim);font-style:italic;font-weight:500}
.meal-macros{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border-2)}
.chip.kcal{color:var(--kcal);background:rgba(245,158,11,.09);border-color:rgba(245,158,11,.25)}
.chip.prot{color:var(--prot);background:rgba(239,83,80,.09);border-color:rgba(239,83,80,.25)}
.chip.carb{color:var(--carb);background:rgba(251,140,59,.09);border-color:rgba(251,140,59,.25)}
.chip.fat{color:var(--fat);background:rgba(79,143,247,.09);border-color:rgba(79,143,247,.25)}
.chip.muted{color:var(--muted);background:var(--bg-2)}
.meal .edit-btn{align-self:flex-start;font-size:12px;color:var(--muted);border:1px dashed var(--border-2);border-radius:9px;padding:5px 10px}
.meal .edit-btn:hover{color:var(--text);border-style:solid}
.fixed-note{font-size:13px;color:var(--text);background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:9px 12px}

/* TRACKERS */
.trackers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tw{padding:14px;display:flex;flex-direction:column;gap:8px}
.tw .h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.tw .h .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.tw.water .ic{background:rgba(59,130,246,.15);color:#3b82f6}
.tw.steps .ic{background:rgba(34,197,94,.15);color:#22c55e}
.tw .h small{margin-left:auto;font-weight:600;font-size:12px;color:var(--muted)}
.glasses{display:flex;flex-wrap:wrap;gap:4px}
.glass{flex:1;min-width:16px;max-width:26px;height:28px;border-radius:6px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.22);position:relative;overflow:hidden;cursor:pointer;transition:transform .1s}
.glass:active{transform:scale(.9)}
.glass.f{background:rgba(59,130,246,.2);border-color:#3b82f6}
.glass.f::after{content:"";position:absolute;left:0;right:0;bottom:0;top:22%;background:linear-gradient(180deg,#60a5fa,#3b82f6)}
.steps-row{display:flex;align-items:center;gap:8px}
.steps-in{flex:1;min-width:0;padding:6px 10px;border-radius:8px;background:var(--bg-2);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:16px}
.steps-btn{width:30px;height:30px;border-radius:8px;background:rgba(34,197,94,.15);color:#22c55e;font-weight:800;font-size:16px;display:grid;place-items:center;flex:none}
.steps-btn:active{background:#22c55e;color:#fff}
.pbar{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:2px}
.pbar .f{height:100%;background:#22c55e;transition:width .4s ease}
.steps-src{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:4px}

/* WEIGHT */
.weight-card{padding:16px;margin-bottom:14px}
.weight-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.weight-head .now{font-size:24px;font-weight:800;letter-spacing:-.02em}
.weight-head .now small{font-size:14px;font-weight:600;color:var(--muted)}
.weight-delta{margin-left:auto;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.weight-delta.down{color:var(--ok);background:rgba(34,197,94,.1)}
.weight-delta.up{color:var(--danger);background:rgba(239,68,68,.1)}
.weight-delta.flat{color:var(--muted);background:var(--bg-2)}
.spark{width:100%;height:64px;display:block}
.weight-add{display:flex;gap:8px;margin-top:12px}
.weight-add input{flex:1;padding:9px 12px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border-2);color:var(--text);font-size:14px}
.weight-add button{padding:9px 16px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}

/* ADHERENCE */
.adh-card{padding:16px;margin-bottom:14px}
.adh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.adh-head .t{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.adh-head .v{font-size:13px;font-weight:800;color:var(--accent)}
.adh-strip{display:flex;gap:6px}
.adh-day{flex:1;aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--bg-2);color:var(--dim);border:1px solid var(--border)}
.adh-day.done{background:rgba(34,197,94,.16);color:var(--ok);border-color:rgba(34,197,94,.3)}
.adh-day.partial{background:rgba(249,115,22,.14);color:var(--warn);border-color:rgba(249,115,22,.3)}
.adh-day.today{outline:2px solid var(--accent);outline-offset:1px}

/* DAY PILLS */
.day-pills{display:flex;gap:8px;overflow-x:auto;margin:0 -12px 12px;padding:2px 12px 8px;flex-wrap:nowrap}
.day-pill{flex:1 0 auto;min-width:54px;padding:10px 4px 8px;border-radius:14px;background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);box-shadow:var(--shadow-card)}
.day-pill .ab{font-size:16px;font-weight:800;letter-spacing:-.02em}
.day-pill .num{font-size:9px;color:var(--dim);font-weight:700}
.day-pill.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.day-pill.active .num{color:rgba(255,255,255,.8)}
.day-pill .tr{width:6px;height:6px;border-radius:50%;background:var(--warn);margin-top:3px}
.day-pill.active .tr{background:#fff}

/* SHOPPING */
.shop-head{display:flex;align-items:center;gap:10px;padding:14px 16px;margin-bottom:14px}
.shop-head .ct{font-weight:700;font-size:14px;flex:1}
.shop-head .ct small{color:var(--muted);font-weight:500;margin-left:6px}
.shop-clear{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;background:var(--bg-2);border:1px solid var(--border);color:var(--muted)}
.cat{margin-bottom:12px;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:800;border-bottom:1px solid var(--border);background:var(--card-2)}
.cat-h .emo{font-size:20px}
.cat-h .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700;background:var(--bg-2);border:1px solid var(--border);padding:3px 9px;border-radius:999px}
.sitem{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;transition:background .15s,opacity .25s}
.sitem:last-child{border-bottom:0}
.sitem:hover{background:var(--bg-2)}
.sitem .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-2);display:grid;place-items:center;font-size:13px;color:transparent;flex:none;transition:all .2s}
.sitem.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.sitem .nm{flex:1;transition:all .25s}
.sitem.done .nm{text-decoration:line-through;opacity:.55}

/* SETTINGS */
.set-group{margin-bottom:14px;overflow:hidden}
.set-group .gh{padding:13px 16px;font-weight:800;font-size:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.set-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.set-row .ic{width:32px;height:32px;border-radius:9px;background:var(--bg-2);display:grid;place-items:center;font-size:16px;flex:none}
.set-row .tx{flex:1;min-width:0}
.set-row .tx .t{font-weight:600;font-size:14px}
.set-row .tx .d{font-size:11.5px;color:var(--muted);margin-top:1px}
.toggle.acc.on{background:linear-gradient(135deg,var(--accent),color-mix(in oklab,var(--accent) 70%,#000))}
.obj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.obj-field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.obj-field input{width:100%;padding:9px 11px;border-radius:9px;background:var(--bg-2);border:1px solid var(--border-2);color:var(--text);font-size:14px;font-weight:600}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg-2);border:1px solid var(--border);border-radius:11px}
.seg button{flex:1;padding:8px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.active{background:var(--accent);color:#fff}
.btn-line{width:100%;padding:12px;border-radius:11px;background:var(--bg-2);border:1px solid var(--border-2);font-weight:600;font-size:13px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:0}
.btn-line:hover{border-color:var(--accent);color:var(--accent)}
.btn-line.danger{color:var(--danger);border-color:rgba(239,68,68,.3)}
.dropzone{border:2px dashed var(--border-2);border-radius:16px;padding:26px 16px;text-align:center;background:var(--bg-2);transition:all .25s;margin:14px 16px}
.dropzone.drag{border-color:var(--ok);background:rgba(34,197,94,.08)}
.dropzone .ico{font-size:38px;display:block;margin-bottom:8px}
.dropzone .pick{padding:9px 16px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:inline-block;margin-top:10px}
.shortcut-box{margin:14px 16px;padding:14px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:12px;font-size:13px;line-height:1.6}
.shortcut-box code{background:var(--card-solid);border:1px solid var(--border-2);border-radius:6px;padding:2px 6px;font-size:12px;word-break:break-all;display:inline-block;margin-top:4px}
.copy-url{margin-top:8px;padding:8px 14px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:12px}

/* MODAL */
.backdrop{position:fixed;inset:0;background:var(--modal-backdrop);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;z-index:200;padding:16px;align-items:center;justify-content:center}
.backdrop.show{display:flex;animation:fade .25s}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card-solid);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow-lg);animation:slidein .3s cubic-bezier(.2,.9,.3,1.05)}
@keyframes slidein{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.modal h3{font-size:18px;font-weight:800;margin-bottom:14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld textarea{width:100%;padding:10px 12px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-size:14px}
.fld input:focus,.fld textarea:focus{border-color:var(--accent)}
.macro4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.m-acts{display:flex;gap:8px;margin-top:14px}
.m-acts button{flex:1;padding:12px;border-radius:12px;font-weight:700}
.btn-cancel{background:var(--bg-2);border:1px solid var(--border-2);color:var(--text)}
.btn-ok{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}

/* TOAST */
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-bot));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:300;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty .emo{font-size:40px;display:block;margin-bottom:8px}
.cal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: var(--card); border-radius: var(--r-md); border: 1px solid var(--border); margin-bottom: 16px; }
.cal-header button { font-size: 16px; width: 36px; height: 36px; border-radius: 50%; background: var(--bg-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text); }
.cal-header h3 { margin: 0; font-size: 16px; text-transform: capitalize; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 24px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
.cal-day { min-height: 80px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; cursor: pointer; position: relative; overflow: hidden; }
.cal-day.empty { background: transparent; border-color: transparent; cursor: default; min-height: 0; }
.cal-day.today { border-color: var(--accent); border-width: 2px; }
.cal-day.future { opacity: 0.5; pointer-events: none; }
.cal-day .d-num { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.cal-day-data { display: flex; flex-direction: column; gap: 2px; font-size: 11px; font-weight: 600; line-height: 1.2; }
.cal-day-data div { display: flex; justify-content: space-between; align-items: center; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.stats-card { background: var(--card); padding: 16px; border-radius: var(--r-md); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
.stats-card.full { grid-column: 1 / -1; }
.stats-val { font-size: 24px; font-weight: 800; color: var(--text); }
.stats-lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="login-card">
    <span class="mark">🥗</span>
    <h1>NutriPlan</h1>
    <p class="sub">¿Quién eres?</p>
    <div class="who-pick">
      <button class="who-btn" data-prof="fran"><span class="av fran">F</span><span class="nm">Fran</span></button>
      <button class="who-btn" data-prof="lua"><span class="av lua">L</span><span class="nm">Lua</span></button>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">NutriPlan<small id="brandSub">Plan semanal</small></div>
    <div class="profile-tabs">
      <button data-prof="fran" class="active"><span class="dot"></span>Fran</button>
      <button data-prof="lua"><span class="dot"></span>Lua</button>
    </div>
    <button class="btn-theme" id="themeBtn" title="Tema">🌙</button>
    <button class="btn-logout" id="logoutBtn" title="Salir">⤶</button>
  </div>

  <!-- HOY -->
  <div class="section active" id="sec-hoy"></div>
  <!-- HISTORIAL -->
  <div class="section" id="sec-historial"></div>
  <!-- COMPRA -->
  <div class="section" id="sec-compra"></div>
  <!-- AJUSTES -->
  <div class="section" id="sec-ajustes"></div>

  <div class="nav">
    <button data-sec="hoy" class="active"><span class="glyph">📊</span>Hoy</button>
    <button data-sec="historial"><span class="glyph">📈</span>Historial</button>
    <button data-sec="compra"><span class="glyph">🛒</span>Compra</button>
    <button data-sec="ajustes"><span class="glyph">⚙️</span>Ajustes</button>
  </div>
</div>

<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ SEED (tu plan real) ============ */
const SEED={"plans":{"fran":{"desayunoFijo":"fruta + café sin azúcar + tostadas (80-100g de pan) + proteína (fiambre/huevo)","meriendasFijas":"una fruta (si no puedes tomarla de tarde)","semana":[{"dia":"Lunes","comida":{"nombre":"Pollo + 250g de patata","ingredientes":["Pollo 250g","Patata 250g"],"calorias":545,"proteinas":67,"carbohidratos":49,"grasas":7},"cena":{"nombre":"Tortilla francesa + brécol","ingredientes":["Huevo 3 ud","Brécol 100g"],"calorias":400,"proteinas":24,"carbohidratos":8,"grasas":22},"meriendaEspecial":""},{"dia":"Martes","comida":{"nombre":"60g de arroz + carne + verduras","ingredientes":["Arroz 60g","Ternera 150g","Verduras 60g"],"calorias":400,"proteinas":35,"carbohidratos":60,"grasas":10},"cena":{"nombre":"Ensalada con atún, queso fresco y vegetales","ingredientes":["Atún 1 lata","Queso fresco 50g","Ensalada 100g"],"calorias":420,"proteinas":40,"carbohidratos":13,"grasas":18},"meriendaEspecial":""},{"dia":"Miércoles","comida":{"nombre":"Pescado + 250g de patata o boniato","ingredientes":["Pescado 250g","Patata 250g"],"calorias":575,"proteinas":44,"carbohidratos":91,"grasas":4},"cena":{"nombre":"2 fajitas","ingredientes":["Fajitas 2 ud","Pollo 150g"],"calorias":500,"proteinas":30,"carbohidratos":45,"grasas":18},"meriendaEspecial":""},{"dia":"Jueves","comida":{"nombre":"50g de arroz + verduras + pollo","ingredientes":["Pollo 150g","Arroz 50g","Verduras 50g"],"calorias":520,"proteinas":50,"carbohidratos":50,"grasas":8},"cena":{"nombre":"Revuelto + ensalada con atún","ingredientes":["Huevo 2 ud","Atún 1 lata","Ensalada 100g"],"calorias":400,"proteinas":32,"carbohidratos":12,"grasas":20},"meriendaEspecial":""},{"dia":"Viernes","comida":{"nombre":"250g de patata/boniato + pollo/pavo/pescado","ingredientes":["Pollo 250g","Patata 250g"],"calorias":700,"proteinas":80,"carbohidratos":91,"grasas":12},"cena":{"nombre":"Ensalada + pollo/pavo","ingredientes":["Pollo 200g","Ensalada 100g"],"calorias":420,"proteinas":62,"carbohidratos":12,"grasas":10},"meriendaEspecial":""},{"dia":"Sábado","comida":{"nombre":"Ternera + ensalada","ingredientes":["Ternera 180g","Ensalada 100g"],"calorias":420,"proteinas":54,"carbohidratos":12,"grasas":17},"cena":{"nombre":"Libre","ingredientes":[],"calorias":0,"proteinas":0,"carbohidratos":0,"grasas":0},"meriendaEspecial":""},{"dia":"Domingo","comida":{"nombre":"Pizza","ingredientes":["Pizza 1 ud"],"calorias":700,"proteinas":28,"carbohidratos":78,"grasas":28},"cena":{"nombre":"Tomate con atún + bol de fruta con yogur","ingredientes":["Atún 1 lata","Tomate 100g","Yogur 1 ud","Fruta 1 ud"],"calorias":400,"proteinas":34,"carbohidratos":14,"grasas":5},"meriendaEspecial":""}]},"lua":{"desayunoFijo":"café sin azúcar + tostadas al gusto (tomate/jamón/aguacate/queso fresco/mermelada ligera/pavo/queso de untar ligero)","meriendasFijas":"una fruta. Puedes tomar una onza de chocolate (cacao >70%) al día","semana":[{"dia":"Lunes","comida":{"nombre":"Pollo + brécol con zanahoria","ingredientes":["Pollo 200g","Brécol 100g","Zanahoria 100g"],"calorias":431,"proteinas":68,"carbohidratos":17,"grasas":8},"cena":{"nombre":"Tortilla francesa al gusto","ingredientes":["Huevo 2 ud"],"calorias":280,"proteinas":18,"carbohidratos":2,"grasas":18},"meriendaEspecial":""},{"dia":"Martes","comida":{"nombre":"250g de patata + carne","ingredientes":["Patata 250g","Ternera 150g"],"calorias":520,"proteinas":40,"carbohidratos":49,"grasas":12},"cena":{"nombre":"Ensalada con atún, queso fresco y vegetales","ingredientes":["Atún 1 lata","Queso fresco 50g","Ensalada 100g"],"calorias":420,"proteinas":40,"carbohidratos":13,"grasas":18},"meriendaEspecial":""},{"dia":"Miércoles","comida":{"nombre":"Pescado con verduras","ingredientes":["Pescado 150g","Verduras 100g"],"calorias":400,"proteinas":40,"carbohidratos":12,"grasas":8},"cena":{"nombre":"1 fajita","ingredientes":["Fajita 1 ud","Pollo 100g"],"calorias":300,"proteinas":22,"carbohidratos":28,"grasas":10},"meriendaEspecial":""},{"dia":"Jueves","comida":{"nombre":"50g de arroz + verduras + pollo","ingredientes":["Pollo 150g","Arroz 50g","Verduras 50g"],"calorias":520,"proteinas":50,"carbohidratos":50,"grasas":8},"cena":{"nombre":"Revuelto al gusto","ingredientes":["Huevo 2 ud"],"calorias":260,"proteinas":16,"carbohidratos":2,"grasas":18},"meriendaEspecial":""},{"dia":"Viernes","comida":{"nombre":"200g de patata + pollo/pavo/pescado","ingredientes":["Pollo 200g","Patata 200g"],"calorias":650,"proteinas":75,"carbohidratos":49,"grasas":12},"cena":{"nombre":"Ensalada con atún, piña/mango y queso fresco","ingredientes":["Atún 1 lata","Queso fresco 50g","Ensalada 100g","Piña 50g"],"calorias":440,"proteinas":40,"carbohidratos":20,"grasas":18},"meriendaEspecial":""},{"dia":"Sábado","comida":{"nombre":"Filete de ternera + ensalada","ingredientes":["Ternera 180g","Ensalada 100g"],"calorias":420,"proteinas":54,"carbohidratos":12,"grasas":17},"cena":{"nombre":"Libre","ingredientes":[],"calorias":0,"proteinas":0,"carbohidratos":0,"grasas":0},"meriendaEspecial":""},{"dia":"Domingo","comida":{"nombre":"Pizza","ingredientes":["Pizza 1 ud"],"calorias":700,"proteinas":28,"carbohidratos":78,"grasas":28},"cena":{"nombre":"Un bol de fruta con yogur","ingredientes":["Yogur 1 ud","Fruta 1 ud"],"calorias":300,"proteinas":12,"carbohidratos":40,"grasas":5},"meriendaEspecial":""}]}}};

const DEFAULT_SETTINGS={weight:true,water:true,steps:true,shopping:true,adherence:true,theme:'auto',
  objKcal:1850,objProt:140,objCarb:180,objFat:60,
  desayunoKcal:350,desayunoProt:20,desayunoCarb:40,desayunoFat:10};

/* ============ STATE ============ */
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DAY_AB=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
let DB={plans:JSON.parse(JSON.stringify(SEED.plans)),plansHistory:{fran:[],lua:[]},user:{fran:freshUser(),lua:freshUser()},updatedAt:0};
let curUser='fran', curSec='hoy', curDayIdx=todayIdx(), curWeekOff=0;
let progressMonth='';

function freshUser(){return{settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),weights:[],logs:{}}}
function todayIdx(){return (new Date().getDay()+6)%7}
function dateKey(off=0){const d=new Date();d.setDate(d.getDate()+off);return d.toISOString().slice(0,10)}
function viewingMonday(){const t=new Date();t.setDate(t.getDate()-todayIdx()+(curWeekOff*7));return t}
function weekDateKeys(){const mon=viewingMonday();return DAYS.map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.toISOString().slice(0,10)})}
function log(date){const u=DB.user[curUser];if(!u.logs[date])u.logs[date]={water:0,steps:0,done:{}};return u.logs[date]}
function settings(){return DB.user[curUser].settings}

function migratePlans(){
  if(!DB.plansHistory) DB.plansHistory={fran:[],lua:[]};
  ['fran','lua'].forEach(u=>{
    if(DB.plansHistory[u].length===0 && DB.plans[u]){
      DB.plansHistory[u].push({startDate:'2020-01-01',plan:JSON.parse(JSON.stringify(DB.plans[u]))});
    }
  });
}
function activePlanPair(){
  const vMon=viewingMonday().toISOString().slice(0,10);
  const hist=DB.plansHistory[curUser];
  let best=hist[0];
  for(let p of hist){if(p.startDate<=vMon && p.startDate>best.startDate) best=p}
  return best;
}
function activePlan(){return activePlanPair().plan}
function S(){return activePlan().semana}


/* ============ PERSIST ============ */
function save(){DB.updatedAt=Date.now();try{localStorage.setItem('nutriplan_db',JSON.stringify(DB))}catch(e){}pushState()}
function load(){try{const r=localStorage.getItem('nutriplan_db');if(r){const p=JSON.parse(r);DB.plans=p.plans||DB.plans;DB.plansHistory=p.plansHistory||DB.plansHistory;DB.user=p.user||DB.user;DB.updatedAt=p.updatedAt||0;['fran','lua'].forEach(k=>{DB.user[k]=Object.assign(freshUser(),DB.user[k]);DB.user[k].settings=Object.assign({},DEFAULT_SETTINGS,DB.user[k].settings)})}}catch(e){} migratePlans(); }

/* ============ SYNC (Supabase) — pega tus 2 datos aquí ============ */
const SUPABASE_URL='https://swcxredmjvrwaragmghm.supabase.co';   /* <-- aquí tu Project URL (https://xxxx.supabase.co) */
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3Y3hyZWRtanZyd2FyYWdtZ2htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDM0MTgsImV4cCI6MjA5NTYxOTQxOH0.Dml8UUtOARaBpb1z0_bjSAYvtKhKmJxDi6nyCC-9dyg';   /* <-- aquí tu anon public key */
let sb=null,_pushT=null,_applying=false;
function syncOn(){return SUPABASE_URL&&SUPABASE_KEY&&window.supabase}
function initSync(){if(!syncOn())return;
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  pullState(true);
  sb.channel('np').on('postgres_changes',{event:'*',schema:'public',table:'nutriplan_state'},p=>{
    const rd=p.new&&p.new.data;if(rd&&(rd.updatedAt||0)>(DB.updatedAt||0))applyRemote(rd)}).subscribe();}
async function pullState(initial){if(!sb)return;
  try{const {data}=await sb.from('nutriplan_state').select('data').eq('id',1).single();
    if(data&&data.data&&(data.data.updatedAt||0)>(DB.updatedAt||0))applyRemote(data.data);
    else if(initial)pushState();}catch(e){}}
function applyRemote(rd){_applying=true;DB.plans=rd.plans||DB.plans;DB.user=rd.user||DB.user;DB.updatedAt=rd.updatedAt||Date.now();
  ['fran','lua'].forEach(k=>{DB.user[k]=Object.assign(freshUser(),DB.user[k]);DB.user[k].settings=Object.assign({},DEFAULT_SETTINGS,DB.user[k].settings)});
  try{localStorage.setItem('nutriplan_db',JSON.stringify(DB))}catch(e){}
  if($('#app').classList.contains('show'))render();_applying=false;toast('🔄 Sincronizado')}
function pushState(){if(!sb||_applying)return;clearTimeout(_pushT);_pushT=setTimeout(async()=>{
  try{await sb.from('nutriplan_state').upsert({id:1,data:DB,updated_at:new Date().toISOString()})}catch(e){}},700)}

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function mealMacros(m){return{k:m.calorias||0,p:m.proteinas||0,c:m.carbohidratos||0,f:m.grasas||0}}
function dayTotals(d){const c=mealMacros(d.comida),n=mealMacros(d.cena);
  return{k:c.k+n.k,p:c.p+n.p,c:c.c+n.c,f:c.f+n.f}}

/* ============ THEME ============ */
function applyTheme(){const t=settings().theme;let dark=t==='dark';if(t==='auto')dark=matchMedia('(prefers-color-scheme:dark)').matches;
  document.body.classList.toggle('dark',dark);
  $('#themeBtn').textContent=dark?'☀️':'🌙';
  $('#theme-color-meta').setAttribute('content',dark?'#11161f':'#f4f6fb');}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(settings().theme==='auto')applyTheme()});

/* ============ RING (SVG) ============ */
function ring(pct,r,color){const c=2*Math.PI*r;const fill=Math.min(pct,1)*c;
  return `<circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--track)" stroke-width="11"/>
  <circle cx="90" cy="90" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${fill.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 90 90)"/>`}

function formatWeekRange(){const k=weekDateKeys();const o={month:'short',day:'numeric'};return new Date(k[0]).toLocaleDateString('es-ES',o)+' - '+new Date(k[6]).toLocaleDateString('es-ES',o)}
function weekNavHeader(){
  let lbl = curWeekOff===0?'Esta semana':(curWeekOff===1?'Próxima semana':(curWeekOff===-1?'Semana pasada':`Semana ${curWeekOff>0?'+':''}${curWeekOff}`));
  return `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);margin-bottom:14px;box-shadow:var(--shadow-card)">
    <button class="wnav-btn" data-woff="-1" style="width:36px;height:36px;background:var(--bg-2);border-radius:10px;font-weight:800;color:var(--text)">←</button>
    <div style="text-align:center"><div style="font-weight:800;font-size:14px">${lbl}</div><div style="font-size:11px;color:var(--muted)">${formatWeekRange()}</div></div>
    <button class="wnav-btn" data-woff="1" style="width:36px;height:36px;background:var(--bg-2);border-radius:10px;font-weight:800;color:var(--text)">→</button>
  </div>`}
function bindWeekNav(){document.querySelectorAll('.wnav-btn').forEach(b=>b.onclick=()=>{curWeekOff+=parseInt(b.dataset.woff);render()})}

/* ============ RENDER: HOY ============ */
function renderHoy(){
  const s=settings(),d=S()[curDayIdx],t=dayTotals(d);
  const logKey = weekDateKeys()[curDayIdx];
  const lg=log(logKey);
  const isFran=curUser==='fran';const name=isFran?'Fran':'Lua';
  const trainKey='train_'+logKey;const isTrain=!!lg[trainKey];
  const kpct=t.k/s.objKcal,ppct=t.p/s.objProt,cpct=t.c/s.objCarb,fpct=t.f/s.objFat;
  const dayName=(curWeekOff===0&&curDayIdx===todayIdx())?`Hoy · ${DAYS[curDayIdx]}`:DAYS[curDayIdx];
  
  let h=weekNavHeader()+`<div class="card psum">
    <div class="avatar ${curUser}">${name[0]}</div>
    <div class="who"><h2>${dayName}</h2><p>${isTrain?'🔥 Día de entreno':'Día de descanso'}</p></div>
    <div class="train-toggle-wrap"><span>Entreno</span><div class="toggle ${isTrain?'on':''}" id="trainToggle"></div></div>
  </div>`;

  let pills=S().map((dy,i)=>{const lg2=DB.user[curUser].logs[weekDateKeys()[i]];const tr=lg2&&lg2['train_'+weekDateKeys()[i]];
    return `<button class="day-pill ${i===curDayIdx?'active':''}" data-day="${i}"><span class="ab">${DAY_AB[i]}</span><span class="num">${dy.dia}</span>${tr?'<span class="tr"></span>':''}</button>`}).join('');
  
  h+=`<div class="day-pills">${pills}</div>`;

  h+=`<div class="card ring-card">
    <div class="ring-wrap"><svg viewBox="0 0 180 180" width="136" height="136">
      ${ring(ppct,54,'var(--prot)')}${ring(cpct,42,'var(--carb)')}${ring(fpct,30,'var(--fat)')}
    </svg><div class="ring-center"><div class="big" style="color:var(--kcal);font-size:24px">${Math.round(t.k)}</div><div class="sub" style="font-size:10px">/ ${s.objKcal} kcal</div></div></div>
    <div class="macro-bars">
      ${mbar('Proteína','var(--prot)',t.p,s.objProt,'g')}
      ${mbar('Carbos','var(--carb)',t.c,s.objCarb,'g')}
      ${mbar('Grasa','var(--fat)',t.f,s.objFat,'g')}
    </div></div>`;

  // meals
  h+=mealCard('comida','🍽️','Comida',d.comida,lg);
  h+=mealCard('cena','🌙','Cena',d.cena,lg);

  if(s.weight)h+=weightCard(logKey);

  $('#sec-hoy').innerHTML=h;
  bindWeekNav();
  bindHoy();
}
function mbar(name,color,val,obj,u){const p=Math.min(val/obj*100,100);

function mealCard(type,ico,label,m,lg){const mm=mealMacros(m);const done=!!(lg.done&&lg.done[type]);const empty=!m.nombre||m.nombre==='Libre';

    `<span class="chip kcal">🔥 ${mm.k}</span><span class="chip prot">P ${mm.p}</span><span class="chip carb">C ${mm.c}</span><span class="chip fat">G ${mm.f}</span>`

  return `<div class="card meal" data-type="${type}">
    <div class="meal-head"><div class="meal-ico">${ico}</div><div class="label">${label}</div>

function waterTracker(lg){const goal=8;const p=Math.min((lg.water||0)/goal,1);

function stepsTracker(lg){const goal=8000;const p=Math.min((lg.steps||0)/goal,1);

function weightCard(logKey){const w=DB.user[curUser].weights;const last=w[w.length-1];const first=w[0];
  let spark='', delta='';if(w.length>1){const pts=w.slice(-14).map((x,i,a)=>`${i*10},${30-((x.kg-a[0].kg)*5)}`).join(' ');

/* ============ RENDER: HISTORIAL ============ */
function renderHistorial(){
  const prof=curUser;
  const hist=DB.user[prof].logs||{};
  if(!progressMonth){
    const d=new Date();progressMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  const [yyyy,mm]=progressMonth.split('-').map(Number);
  const mNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const mName=mNames[mm-1];

  const firstDayObj=new Date(yyyy,mm-1,1);
  const lastDayObj=new Date(yyyy,mm,0);
  const daysInMonth=lastDayObj.getDate();
  const startDow=(firstDayObj.getDay()+6)%7;

  const todayKey=dateKey(0);

  let h=`<div class="cal-header"><button data-act="cal-prev">◀</button><h3>${mName} ${yyyy}</h3><button data-act="cal-next">▶</button></div>
  <div class="cal-grid">${['L','M','X','J','V','S','D'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}`;

  for(let i=0;i<startDow;i++) h+=`<div class="cal-day empty"></div>`;

  let mSteps=0,mWater=0,mTrain=0,mDays=0;

  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${yyyy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hData=hist[dateStr]||{};
    const isToday=dateStr===todayKey;
    const isFuture=dateStr>todayKey;

    if(!isFuture && dateStr<=todayKey){
      mSteps+=(hData.steps||0);
      mWater+=(hData.water||0);
      if(hData['train_'+dateStr]) mTrain++;
      mDays++;
    }

    let dataHtml='';
    if(hData.water||hData.steps||hData['train_'+dateStr]){
      dataHtml=`<div class="cal-day-data">`;
      if(hData.water) dataHtml+=`<div><span>💧</span><span>${hData.water}</span></div>`;
      if(hData.steps){
        const sFmt=hData.steps>=1000?(hData.steps/1000).toFixed(1)+'k':hData.steps;
        const color=hData.steps>=10000?'#10b981':(hData.steps>=6000?'#f59e0b':'inherit');
        dataHtml+=`<div style="color:${color}"><span>👟</span><span>${sFmt}</span></div>`;
      }
      if(hData['train_'+dateStr]) dataHtml+=`<div><span>🏋️</span><span>✓</span></div>`;
      dataHtml+=`</div>`;
    }

    let cls="cal-day"+(isToday?' today':'')+(isFuture?' future':'');
    h+=`<div class="${cls}" ${isFuture?'':`onclick="openEditPastModal('${dateStr}')"`}><div class="d-num">${d}</div>${dataHtml}</div>`;
  }
  h+=`</div>`;

  // Stats block
  const avgS=mDays?Math.round(mSteps/mDays):0;
  const avgW=mDays?(mWater/mDays).toFixed(1):0;
  h+=`<div class="section-title">Estadísticas del mes</div>
  <div class="stats-grid">
    <div class="stats-card"><span class="stats-lbl">Media Pasos</span><span class="stats-val" style="color:#10b981">${avgS.toLocaleString()}</span></div>
    <div class="stats-card"><span class="stats-lbl">Media Agua</span><span class="stats-val" style="color:#3b82f6">${avgW} <span style="font-size:14px">v/d</span></span></div>
    <div class="stats-card full"><span class="stats-lbl">Días Entrenados</span><span class="stats-val" style="color:#f97316">${mTrain} <span style="font-size:14px">días</span></span></div>
  </div>`;

  $('#sec-historial').innerHTML=h;
  
  document.querySelectorAll('#sec-historial button[data-act]').forEach(b=>b.onclick=e=>{
    const act=e.currentTarget.dataset.act;
    let m=mm, y=yyyy;
    if(act==='cal-prev'){m--;if(m<1){m=12;y--}}
    if(act==='cal-next'){m++;if(m>12){m=1;y++}}
    progressMonth=`${y}-${String(m).padStart(2,'0')}`;
    renderHistorial();
  });
}

function showDocxImport(text) {
  const parsed = parseDocxText(text);

    return window.showDocxImportFallback(text);
  }
  const t=new Date();t.setDate(t.getDate()-todayIdx()+7);const nextMon=t.toISOString().slice(0,10);

  parsed.dias.forEach(d => {
    h += '<b>'+d.dia+'</b><br>☀️ '+(d.comida.nombre||'—')+'<br>🌙 '+(d.cena.nombre||'—')+'<br><br>';
  });
  h += '</div><div class="m-acts"><button class="btn-cancel" id="dCnc">Cancelar</button><button class="btn-ok" id="dOk">Guardar Plan</button></div>';
  $('#modal').innerHTML = h;

  $('#dOk').onclick = () => {
    const dt = $('#docx-date').value;
    const hist = DB.plansHistory[curUser];
    if (hist.find(x => x.startDate === dt)) {
      toast('Ya hay un plan para esa fecha, se sobrescribirá');
    }
    const plan = JSON.parse(JSON.stringify(SEED.plans[curUser]));
    plan.semana = DAYS.map(dName => {
      const f = parsed.dias.find(x => x.dia.toLowerCase() === dName.toLowerCase());
      if (f) return { dia: dName, comida: f.comida, cena: f.cena, meriendaEspecial: '' };
      return { dia: dName, comida: emptyMeal(), cena: emptyMeal(), meriendaEspecial: '' };
    });
    plan.desayunoFijo = parsed.desayuno || plan.desayunoFijo;
    plan.meriendasFijas = parsed.merienda || plan.meriendasFijas;
    const exIdx = hist.findIndex(x => x.startDate === dt);
    if (exIdx >= 0) hist[exIdx].plan = plan;
    else hist.push({ startDate: dt, plan: plan });

function unitForName(name) {

function findExplicitQty(text, matchWord) {
  const lower = text.toLowerCase();
  const idx = lower.indexOf(matchWord.toLowerCase());
  if (idx < 0) return null;
  const start = Math.max(0, idx - 50);
  const end = Math.min(text.length, idx + matchWord.length + 50);
  const win = text.slice(start, end);
  let m = win.match(/(\d+(?:[.,]\d+)?)\s*(kg|kgs|gramos|gr|g)\b/i);
  if (m) {
    const n = parseFloat(m[1].replace(",", "."));
    const u = m[2].toLowerCase();
    return { qty: u.startsWith("kg") ? Math.round(n * 1000) : Math.round(n), unit: "g" };
  }
  m = win.match(/(\d+)\s*(ml|cl|l)\b/i);
  if (m) {
    const n = parseInt(m[1], 10);
    const u = m[2].toLowerCase();
    return { qty: u === "l" ? n * 1000 : (u === "cl" ? n * 10 : n), unit: "ml" };
  }
  m = win.match(/(\d+)\s*(unidades?|uds?|fajitas?|tortitas?|wraps?|latas?|huevos?|piezas?|rebanadas?|lonchas?|yogures?|yogurts?)\b/i);
  if (m) {
    let u = m[2].toLowerCase().replace(/s$/, "");
    if (u === "huevo" || u === "pieza" || u === "unidade" || u === "unidad" || u === "ud") u = "ud";
    if (u === "yogure" || u === "yogurt") u = "ud";
    return { qty: parseInt(m[1], 10), unit: u };
  }
  return null;
}
function formatIng(name, qty, unit) {
  if (!qty || !unit) return name;
  if (unit === "g" || unit === "ml") return `${name} ${qty}${unit}`;
  return `${name} ${qty} ${unit}`;
}
function parseIngString(str) {
  if (!str) return { name: "", qty: null, unit: null };
  let m = str.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(kg|g|gramos|gr|ml|cl|l)\b/i);
  if (m) {
    const n = parseFloat(m[2].replace(",", "."));
    const u = m[3].toLowerCase();
    if (u.startsWith("k")) return { name: m[1].trim(), qty: Math.round(n * 1000), unit: "g" };
    if (u === "l")        return { name: m[1].trim(), qty: Math.round(n * 1000), unit: "ml" };
    if (u === "cl")       return { name: m[1].trim(), qty: Math.round(n * 10),   unit: "ml" };
    if (u === "ml")       return { name: m[1].trim(), qty: Math.round(n),         unit: "ml" };
    return { name: m[1].trim(), qty: Math.round(n), unit: "g" };
  }
  m = str.match(/^(.+?)\s+(\d+)\s*(ud|uds|unidades?|unidad|fajitas?|tortitas?|wraps?|latas?|piezas?|rebanadas?|lonchas?|raciones?)\b/i);
  if (m) {
    let u = m[3].toLowerCase().replace(/s$/, "");
    if (u === "unidade" || u === "unidad" || u === "ud" || u === "pieza" || u === "racione" || u === "racion") u = "ud";
    return { name: m[1].trim(), qty: parseInt(m[2], 10), unit: u };
  }
  return { name: str.trim(), qty: null, unit: null };
}
function formatGrams(n) {
  if (n >= 1000) {
    const v = n / 1000;
    return (v % 1 === 0 ? v.toFixed(0) : v.toFixed(2).replace(/\.?0+$/, "")).replace(".", ",") + " kg";
  }
  return n + " g";
}
function formatMl(n) {
  if (n >= 1000) return (n/1000).toFixed(n%1000===0?0:1).replace(".", ",") + " L";
  return n + " ml";
}
function formatShopQty(it) {
  const parts = [];
  if (it.grams) parts.push(formatGrams(it.grams));
  if (it.ml) parts.push(formatMl(it.ml));
  for (const [u, n] of Object.entries(it.units)) parts.push(`x${n} ${u}`);
  if (!parts.length && it.count > 1) parts.push(`x${it.count} raciones`);
  return parts.join(" · ");
}

function parseDocxText(text) {
  // Normalize
  const lines = text.split(/\r?\n/).map(l => l.replace(/\u00A0/g, " ").trim()).filter(Boolean);
  const upper = lines.map(l => l.toUpperCase());

  let desayuno = "", merienda = "";
  // find desayuno line
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^desayuno\s*[:\-–]\s*(.+)$/i);
    if (m) { desayuno = collectMulti(lines, i, m[1]); break; }
  }
  // find merienda / postre / media tarde
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^(media tarde|merienda|postre(?: medio?d[ií]a)?)\s*[:\-–]\s*(.+)$/i);
    if (m) { merienda = collectMulti(lines, i, m[2]); break; }
  }

  // find day blocks
  const dayRegex = /^\s*\**\s*(LUNES|MARTES|MIÉRCOLES|MIERCOLES|JUEVES|VIERNES|S[ÁA]BADO|DOMINGO)\b\s*\**(.*)$/i;
  const startsByDay = [];
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(dayRegex);
    if (m) startsByDay.push({ idx: i, name: normalizeDay(m[1]), tail: m[2] });
  }
  const dias = [];
  for (let k = 0; k < startsByDay.length; k++) {
    const cur = startsByDay[k];
    const end = startsByDay[k+1]?.idx ?? lines.length;
    const blockLines = lines.slice(cur.idx, end);
    const block = blockLines.join("\n");
    const trainHere = /\(\s*d[ií]a de entreno\s*\)|entreno/i.test(block);

    // Find Comida and Cena segments
    const comida = extractMealSegment(blockLines, /^comida\b/i, [/^cena\b/i]);
    const cena   = extractMealSegment(blockLines, /^cena\b/i, []);
    dias.push({
      dia: cur.name,
      entreno: trainHere,
      comida: estimateMacros(comida.text, comida.title),
      cena:   estimateMacros(cena.text,   cena.title),
      meriendaEspecial: ""
    });
  }
  return { desayuno, merienda, dias };
}
function collectMulti(lines, startIdx, firstChunk) {
  let out = firstChunk.trim();
  for (let j = startIdx + 1; j < lines.length; j++) {
    const ln = lines[j];
    if (/^(desayuno|media tarde|merienda|postre|comida|cena|lunes|martes|mi[eé]rcoles|jueves|viernes|s[áa]bado|domingo)\b/i.test(ln)) break;
    if (ln.length > 200) break;
    if (out.length > 250) break;
    out += " " + ln;
  }
  return out.trim();
}
function normalizeDay(d) {
  d = d.toUpperCase().replace("MIERCOLES","MIÉRCOLES").replace("SABADO","SÁBADO");
  return d.charAt(0) + d.slice(1).toLowerCase();
}
function extractMealSegment(blockLines, startRe, stopRes) {
  // search for line starting with startRe
  for (let i = 0; i < blockLines.length; i++) {
    const ln = blockLines[i];
    const m = ln.match(/^(comida|cena)\s*[:\-–]?\s*(.*)$/i);
    if (m && startRe.test(ln)) {
      const title = m[2]?.trim() || "";
      const out = [title];
      for (let j = i + 1; j < blockLines.length; j++) {
        const cur = blockLines[j];
        if (stopRes.some(r => r.test(cur))) break;
        if (/^(comida|cena)\b/i.test(cur)) break;
        if (/^(lunes|martes|mi[eé]rcoles|jueves|viernes|s[áa]bado|domingo)\b/i.test(cur)) break;
        out.push(cur);
      }
      const fullText = out.filter(Boolean).join(". ");
      return { text: fullText, title: shortName(fullText) };
    }
  }
  return { text: "", title: "" };
}
function shortName(text) {
  if (!text) return "";
  // take first sentence-ish chunk, max 60 chars
  let t = text.split(/[.\n;]/)[0].trim();
  if (t.length > 60) t = t.slice(0, 57) + "…";
  return t;
}
function estimateMacros(text, title) {
  const meal = emptyMeal();
  meal.nombre = title || shortName(text);
  if (!text) return meal;
  const found = new Set();
  const ings = [];
  for (const f of FOOD_DICT) {
    if (f.match.test(text) && !found.has(f.match.source)) {
      found.add(f.match.source);
      meal.calorias += f.kcal; meal.proteinas += f.prot; meal.carbohidratos += f.carb; meal.grasas += f.fat;
      const word = (text.match(f.match) || [""])[0];
      const cap = word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
      const explicit = findExplicitQty(text, word);
      const fallback = unitForName(cap);
      const qty = explicit ? explicit.qty : fallback.def;
      const unit = explicit ? explicit.unit : fallback.unit;
      ings.push(formatIng(cap, qty, unit));
    }
  }
  if (!ings.length) ings.push(...guessIngredients(meal.nombre));
  meal.ingredientes = [...new Set(ings)];
  if (meal.calorias < 300) meal.calorias = Math.max(meal.calorias, 400);
  return meal;
}
function guessIngredients(name) {
  const tokens = name.toLowerCase().split(/\s+|,|\sy\s|\scon\s/).filter(t => t.length > 2);
  const seen = new Set(); const out = [];
  for (const t of tokens) {
    const cap = t[0].toUpperCase() + t.slice(1);
    if (!seen.has(cap) && !["con","sin","plancha","horno","integral","cocida","cocido","asado","asada"].includes(t)) {
      seen.add(cap); out.push(cap);
    }
  }
  return out.length ? out : [name];
}
